<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- ===== SEO ===== -->
  <title>Đăng nhập | PawStay</title>
  <meta name="description" content="Đăng nhập tài khoản PawStay để đặt lịch gửi thú cưng và quản lý lịch sử chăm sóc nhanh chóng." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/style.css?v=4" />
  <link rel="stylesheet" href="css/login.css?v=1" />
</head>
<body>

  <!-- ===================== MAIN LAYOUT ===================== -->
  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Card Header -->
      <header class="auth-header">
        <span class="logo-icon" aria-hidden="true">🐾</span>
        <h1 class="auth-title">Chào mừng trở lại</h1>
        <p class="auth-subtitle">Đăng nhập tài khoản PawStay của bạn để tiếp tục</p>
      </header>

      <!-- Form login -->
      <form id="login-form" novalidate>
        
        <!-- Email -->
        <div class="form-group">
          <label for="login-email">Địa chỉ Email</label>
          <input type="email" id="login-email" placeholder="example@gmail.com" required />
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
          <div class="password-label-row">
            <label for="login-password">Mật khẩu</label>
            <a href="forgot-password.html" class="forgot-pwd-link">Quên mật khẩu?</a>
          </div>
          <div class="password-wrap">
            <input type="password" id="login-password" placeholder="Nhập mật khẩu..." required />
            <button type="button" class="password-toggle" id="btn-toggle-pwd" aria-label="Hiện mật khẩu">
              👁️
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary submit-btn">
          Đăng nhập
        </button>

      </form>

      <!-- Footer navigation -->
      <footer class="auth-footer">
        Bạn chưa có tài khoản? 
        <a href="signup.html" class="auth-link">Đăng ký ngay</a>
      </footer>

    </div>
  </main>

  <!-- ===================== JAVASCRIPT ===================== -->
  <script src="assets/api.js?v=4"></script>
  <script src="assets/data.js?v=4"></script>
  <script src="assets/components.js?v=4"></script>
  <script src="js/login.js?v=1" defer></script>
</body>
</html>
