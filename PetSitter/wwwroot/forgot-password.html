<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | PawStay</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="assets/style.css?v=4">
    <link rel="stylesheet" href="css/forgot-password.css?v=1">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Quên mật khẩu</h1>
            <p>Nhập email để nhận hướng dẫn đặt lại mật khẩu</p>
        </div>
        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary submit-btn">Gửi yêu cầu</button>
        </form>
        <div id="result-msg" class="result-msg"></div>
    </div>
    
    <script src="assets/api.js?v=4"></script>
    <script src="assets/components.js?v=4"></script>
    <script src="js/forgot-password.js?v=1" defer></script>
</body>
</html>
