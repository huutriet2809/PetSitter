<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | PawStay</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .auth-container { max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .auth-header p { color: var(--text-secondary); }
        .dev-link { margin-top: 20px; padding: 15px; background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 8px; font-size: 0.9rem; word-break: break-all; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Quên mật khẩu</h1>
            <p>Nhập email để nhận hướng dẫn đặt lại mật khẩu</p>
        </div>
        <form id="forgot-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 10px;">Gửi yêu cầu</button>
        </form>
        <div id="result-msg" style="margin-top:20px; text-align:center;"></div>
    </div>
    
    <script src="assets/api.js"></script>
    <script src="assets/components.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = e.target.querySelector('button');
            const resultMsg = document.getElementById('result-msg');
            
            btn.disabled = true;
            btn.textContent = 'Đang gửi...';
            resultMsg.innerHTML = '';

            try {
                const res = await apiFetch('/auth/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });
                
                let html = '<div style="color: green; padding: 10px; background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 8px;">' + res.message + '</div>';
                if (res.devResetLink) {
                    html += '<div class="dev-link"><strong>Link dành cho Dev:</strong><br><a href="' + res.devResetLink + '">' + res.devResetLink + '</a></div>';
                }
                resultMsg.innerHTML = html;
            } catch (err) {
                resultMsg.innerHTML = '<div style="color: red;">' + err.message + '</div>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Gửi yêu cầu';
            }
        });
    </script>
</body>
</html>
