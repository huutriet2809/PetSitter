<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử đặt lịch - PawStay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .history-container { max-width: 800px; margin: 40px auto; padding: 20px; }
    .booking-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 15px; }
    .booking-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .status-pending { background: rgba(234, 179, 8, 0.1); color: #eab308; }
    .status-accepted { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .status-completed { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
    .status-cancelled, .status-rejected { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .status-expired { background: rgba(107, 114, 128, 0.1); color: #6b7280; }
    #error-msg { background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 4px; display: none; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="history-container">
    <h1>Lịch sử đặt lịch của tôi</h1>
    <div id="error-msg"></div>
    <div id="booking-list">Đang tải...</div>
  </div>

  <!-- Modal Đánh giá -->
  <div class="modal" id="review-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Viết đánh giá</h3>
        <button class="modal-close" onclick="closeReviewModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="review-form">
          <input type="hidden" id="review-booking-id" />
          <div style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Đánh giá (1-5 sao)</label>
            <select id="review-rating" style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border); background:var(--bg-primary);">
              <option value="5">5 - Rất hài lòng</option>
              <option value="4">4 - Hài lòng</option>
              <option value="3">3 - Bình thường</option>
              <option value="2">2 - Không hài lòng</option>
              <option value="1">1 - Tệ</option>
            </select>
          </div>
          <div style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Nhận xét (Tối đa 500 ký tự)</label>
            <textarea id="review-comment" style="width:100%; height:100px; padding:10px; border-radius:6px; border:1px solid var(--border); background:var(--bg-primary);"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Gửi đánh giá</button>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('pawstay_token')) {
        window.location.href = 'login.html';
        return;
      }
      loadBookings();
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    const formatNgayDep = (str) => {
      if (!str) return '';
      const d = new Date(str);
      return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    };

    async function loadBookings() {
      const container = document.getElementById('booking-list');
      try {
        const bookings = await apiFetch('/bookings/my');
        if (bookings.length === 0) {
          container.innerHTML = '<p>Bạn chưa có chuyến đi nào.</p>';
          return;
        }

        container.innerHTML = bookings.map(b => {
          let statusClass = 'status-pending';
          if (b.trangThai === 'ACCEPTED') statusClass = 'status-accepted';
          if (b.trangThai === 'COMPLETED') statusClass = 'status-completed';
          if (b.trangThai === 'CANCELLED' || b.trangThai === 'REJECTED') statusClass = 'status-rejected';
          if (b.trangThai === 'EXPIRED') statusClass = 'status-expired';

          let cancelBtn = '';
          if (b.trangThai === 'PENDING' || (b.trangThai === 'ACCEPTED' && new Date(b.ngayBatDau).getTime() > Date.now())) {
            cancelBtn = `<button class="btn btn-outline btn-sm" onclick="cancelBooking('${/* safe */ b.bookingId}')">Hủy chuyến</button>`;
          }

          let actionBtns = `
            <div class="booking-actions" style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
              ${/* safe */ cancelBtn}
              <a href="stay-updates.html?bookingId=${/* safe */ b.bookingId}" class="btn btn-outline btn-sm">Nhật ký chăm sóc</a>
              ${/* safe */ b.trangThai === 'COMPLETED' ? (b.hasReview ? '<span style="font-size:0.85rem; color:var(--text-muted);">Đã đánh giá</span>' : `<button class="btn btn-primary btn-sm" onclick="openReviewModal('${/* safe */ b.bookingId}')">Viết đánh giá</button>`) : ''}
              <a href="sitter-profile.html?id=${/* safe */ b.sitterId}" class="btn btn-ghost btn-sm">Xem Sitter</a>
            </div>
          `;

          return `
            <div class="booking-card" id="card-${/* safe */ b.bookingId}">
              <div class="booking-header">
                <div>
                  <strong>Mã: ${escapeHtml(b.maDatLich)}</strong> - Sitter: <a href="sitter-profile.html?id=${/* safe */ b.sitterId}">${escapeHtml(b.sitterName)}</a>
                </div>
                <div style="text-align:right;">
                  <span class="status-badge ${/* safe */ statusClass}">${/* safe */ b.trangThai}</span>
                </div>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                  <p><strong>Ngày:</strong> ${formatNgayDep(b.ngayBatDau)} - ${formatNgayDep(b.ngayKetThuc)}</p>
                  <p><strong>Thú cưng:</strong> ${escapeHtml(b.pet?.tenPet || '')}</p>
                  ${/* safe */ (b.trangThai === 'PENDING' && b.expiresAt) ? `<p style="font-size:0.85rem; color:#eab308;"><strong>Hạn phản hồi:</strong> ${formatNgayDep(b.expiresAt)}</p>` : ''}
                </div>
                <div>
                  <p><strong>Chi phí ước tính:</strong> ${formatTien(b.tongTien)}</p>
                  ${/* safe */ b.lyDoTuChoi ? `<p style="color: #ef4444; margin-top: 5px;"><strong>Lý do:</strong> ${escapeHtml(b.lyDoTuChoi)}</p>` : ''}
                </div>
              </div>
              ${/* safe */ actionBtns}
            </div>
          `;
        }).join('');
      } catch (err) {
        showError(err.message || 'Lỗi tải danh sách.');
        container.innerHTML = '';
      }
    }

    function openReviewModal(bookingId) {
      document.getElementById('review-booking-id').value = bookingId;
      document.getElementById('review-rating').value = '5';
      document.getElementById('review-comment').value = '';
      document.getElementById('review-modal').classList.add('open');
    }

    function closeReviewModal() {
      document.getElementById('review-modal').classList.remove('open');
    }

    document.getElementById('review-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const bookingId = document.getElementById('review-booking-id').value;
      const rating = parseInt(document.getElementById('review-rating').value);
      const comment = document.getElementById('review-comment').value;

      try {
        await apiFetch(`/bookings/${bookingId}/review`, {
          method: 'POST',
          body: JSON.stringify({ rating, comment })
        });
        showToast('Đánh giá thành công!', 3000, '⭐');
        closeReviewModal();
        loadBookings();
      } catch (err) {
        showToast(err.message, 3000, '❌');
      }
    });

    async function cancelBooking(id) {
      if (!confirm('Bạn có chắc chắn muốn hủy chuyến này?')) return;
      try {
        await apiFetch(`/bookings/${id}/cancel`, { method: 'POST' });
        loadBookings();
      } catch (e) {
        showError(e.message);
      }
    }
  </script>
</body>
</html>
