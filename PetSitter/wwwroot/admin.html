<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Duyệt Sitter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
    .action-btns button { margin-left: 10px; }
    #error-msg { background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 4px; display: none; margin-bottom: 20px; }
    .reject-container { margin-top: 10px; display: none; }
    .reject-container input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); border-radius: 4px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; }
    .tab.active { border-bottom-color: var(--primary); color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>Quản trị hệ thống PawStay</h1>
    <div class="tabs">
      <div class="tab active" id="tab-applications" onclick="switchTab('applications')">Hồ sơ Sitter chờ duyệt</div>
      <div class="tab" id="tab-disputes" onclick="switchTab('disputes')">Đơn khiếu nại (Disputed)</div>
      <div class="tab" id="tab-payments" onclick="switchTab('payments')">Thanh toán & Hoàn tiền</div>
    </div>
    <div id="error-msg"></div>
    <div id="list-container">Đang tải...</div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/components.js"></script>
  <script>
    let currentTab = 'applications';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!localStorage.getItem('pawstay_token')) {
        window.location.href = 'login.html';
        return;
      }
      const urlParams = new URLSearchParams(window.location.search);
      const targetBookingId = urlParams.get('bookingId');
      if (targetBookingId) {
        switchTab('disputes');
      } else {
        loadApplications();
      }
    });

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const activeEl = document.getElementById(`tab-${tab}`);
      if (activeEl) activeEl.classList.add('active');

      if (tab === 'applications') {
        loadApplications();
      } else if (tab === 'disputes') {
        loadDisputes();
      } else if (tab === 'payments') {
        loadPaymentsOverview();
      }
    }

    async function loadApplications() {
      const container = document.getElementById('list-container');
      container.innerHTML = 'Đang tải...';
      try {
        const apps = await apiFetch('/admin/sitter-applications?status=Pending');
        if (apps.length === 0) {
          container.innerHTML = '<p>Không có hồ sơ nào đang chờ duyệt.</p>';
          return;
        }

        container.innerHTML = apps.map(app => `
          <div class="card" id="app-${/* safe */ app.id}">
            <div class="header-row">
              <h3>${escapeHtml(app.fullName)} (Khu vực: ${escapeHtml(app.khuVuc)})</h3>
              <div class="action-btns">
                <button class="btn btn-primary btn-sm" onclick="approve('${/* safe */ app.id}')">Duyệt</button>
                <button class="btn btn-outline btn-sm" onclick="showReject('${/* safe */ app.id}')">Từ chối</button>
              </div>
            </div>
            <p><strong>Kinh nghiệm:</strong> ${/* safe */ app.kinhNghiem} năm</p>
            <p><strong>Giá cơ bản:</strong> ${formatTien(app.giaMoiNgay)} / ngày</p>
            <p><strong>Loại Pet nhận:</strong> ${(app.loaiPetNhan || []).map(escapeHtml).join(', ')}</p>
            <p><strong>Tags:</strong> ${(app.tags || []).map(escapeHtml).join(', ')}</p>
            <p><strong>Bio:</strong> ${escapeHtml(app.bio)}</p>
            
            <div class="reject-container" id="reject-${/* safe */ app.id}">
              <input type="text" id="lydo-${/* safe */ app.id}" placeholder="Lý do từ chối..." />
              <button class="btn btn-outline btn-sm" onclick="reject('${/* safe */ app.id}')">Xác nhận từ chối</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showError(err.message || 'Lỗi tải danh sách hồ sơ. Bạn có phải Admin không?');
        container.innerHTML = '';
      }
    }

    async function loadDisputes() {
      const container = document.getElementById('list-container');
      container.innerHTML = 'Đang tải danh sách khiếu nại...';
      try {
        const disputes = await apiFetch('/admin/disputed-bookings');
        if (disputes.length === 0) {
          container.innerHTML = '<p>Không có đơn đặt lịch nào đang khiếu nại.</p>';
          return;
        }

        container.innerHTML = disputes.map(d => `
          <div class="card" id="dispute-${/* safe */ d.bookingId}" style="border-left: 4px solid #ea580c;">
            <div class="header-row">
              <div>
                <h3>Đơn #${escapeHtml(d.maDatLich)} - Sitter: ${escapeHtml(d.sitterName)}</h3>
                <span class="status-badge" style="background: rgba(249, 115, 22, 0.1); color: #ea580c; font-weight:600;">Đang tranh chấp</span>
              </div>
              <div>
                <strong>Tổng tiền: ${formatTien(d.tongTien)}</strong>
              </div>
            </div>
            <div style="margin: 10px 0; padding: 10px; background: rgba(239, 68, 68, 0.05); border-radius: 6px;">
              <strong>⚠️ Lý do khiếu nại từ chủ nuôi:</strong>
              <p style="margin: 5px 0; color: #dc2626;">${escapeHtml(d.disputeReason || 'Không có lý do chi tiết')}</p>
            </div>
            <p><strong>Thời gian gửi:</strong> ${new Date(d.ngayBatDau).toLocaleDateString('vi-VN')} - ${new Date(d.ngayKetThuc).toLocaleDateString('vi-VN')} (${/* safe */ d.soNgay} ngày)</p>
            <p><strong>Thú cưng:</strong> ${escapeHtml(d.pet?.tenPet || '')} (${escapeHtml(d.pet?.loaiPet || '')})</p>
            
            <div style="margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 15px;">
              <label style="display:block; margin-bottom: 6px; font-weight: 600;">Ghi chú xử lý của Admin (10 đến 500 ký tự) <span style="color:#ef4444;">*</span></label>
              <textarea id="note-${/* safe */ d.bookingId}" placeholder="Nhập kết luận và căn cứ giải quyết tranh chấp..." style="width:100%; height:80px; padding:8px; border:1px solid var(--border); border-radius:4px; background:var(--bg-secondary); color:var(--text-primary); margin-bottom:10px;"></textarea>
              <div style="display:flex; gap:10px;">
                <button class="btn btn-primary btn-sm" onclick="resolveDispute('${/* safe */ d.bookingId}', 'COMPLETED')">Duyệt hoàn tất (COMPLETED)</button>
                <button class="btn btn-outline btn-sm" style="color:#ef4444; border-color:#ef4444;" onclick="resolveDispute('${/* safe */ d.bookingId}', 'CANCELLED')">Hủy đơn (CANCELLED)</button>
              </div>
            </div>
          </div>
        `).join('');

        const urlParams = new URLSearchParams(window.location.search);
        const targetBookingId = urlParams.get('bookingId');
        if (targetBookingId) {
          const targetCard = document.getElementById(`dispute-${targetBookingId}`);
          if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetCard.classList.add('booking-highlight');
          }
        }
      } catch (err) {
        showError(err.message || 'Lỗi tải danh sách khiếu nại.');
        container.innerHTML = '';
      }
    }

    async function resolveDispute(bookingId, resolution) {
      const noteInput = document.getElementById(`note-${bookingId}`);
      const note = noteInput ? noteInput.value.trim() : '';

      if (note.length < 10 || note.length > 500) {
        showError('Ghi chú xử lý bắt buộc từ 10 đến 500 ký tự.');
        return;
      }

      if (!confirm(`Xác nhận giải quyết tranh chấp với kết quả: ${resolution}?`)) return;

      try {
        await apiFetch(`/admin/bookings/${bookingId}/resolve`, {
          method: 'PATCH',
          body: JSON.stringify({ resolution, note })
        });
        showToast(`Đã giải quyết tranh chấp thành công (${resolution})!`, 3000, '✅');
        const card = document.getElementById(`dispute-${bookingId}`);
        if (card) card.remove();
        if (!document.querySelector('#list-container .card')) {
          loadDisputes();
        }
      } catch (err) {
        showError(err.message || 'Lỗi khi giải quyết tranh chấp.');
      }
    }

    function showReject(id) {
      document.getElementById(`reject-${id}`).style.display = 'block';
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    async function approve(id) {
      try {
        await apiFetch(`/admin/sitter-applications/${id}/approve`, { method: 'PATCH' });
        document.getElementById(`app-${id}`).remove();
      } catch (err) {
        showError(err.message);
      }
    }

    async function reject(id) {
      const reason = document.getElementById(`lydo-${id}`).value;
      if (!reason.trim()) {
        showError('Vui lòng nhập lý do từ chối.');
        return;
      }
      try {
        await apiFetch(`/admin/sitter-applications/${id}/reject`, { 
          method: 'PATCH',
          body: JSON.stringify({ lyDo: reason })
        });
        document.getElementById(`app-${id}`).remove();
      } catch (err) {
        showError(err.message);
      }
    }

    async function loadPaymentsOverview() {
      const container = document.getElementById('list-container');
      container.innerHTML = 'Đang tải dữ liệu tài chính...';
      try {
        const [overview, refunds] = await Promise.all([
          apiFetch('/admin/payments/overview'),
          apiFetch('/admin/refunds?status=REFUND_PENDING')
        ]);

        let refundRows = '<p style="color:var(--text-muted); margin-top:10px;">Không có yêu cầu hoàn tiền nào đang chờ xử lý.</p>';
        if (refunds && refunds.length > 0) {
          refundRows = `
            <table style="width:100%; border-collapse:collapse; margin-top:15px; font-size:0.9rem;">
              <thead>
                <tr style="text-align:left; border-bottom:2px solid var(--border);">
                  <th style="padding:8px;">Mã đơn</th>
                  <th style="padding:8px;">Số tiền</th>
                  <th style="padding:8px;">Lý do</th>
                  <th style="padding:8px;">Tài khoản nhận</th>
                  <th style="padding:8px;">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                ${refunds.map(r => `
                  <tr style="border-bottom:1px solid var(--border);">
                    <td style="padding:8px;"><strong>${escapeHtml(r.bookingCode || r.bookingId)}</strong></td>
                    <td style="padding:8px; color:#ef4444; font-weight:600;">${formatTien(r.amount)}</td>
                    <td style="padding:8px;">${escapeHtml(r.reason)}</td>
                    <td style="padding:8px;">
                      ${/* safe */ r.refundAccount ? `${escapeHtml(r.refundAccount.bankName)} - <strong>${escapeHtml(r.refundAccount.accountNumber)}</strong> (${escapeHtml(r.refundAccount.accountName)})` : '<span style="color:#ca8a04;">Chờ khách nhập STK</span>'}
                    </td>
                    <td style="padding:8px;">
                      <div style="display:flex; gap:6px; align-items:center;">
                        <input type="text" id="ref-code-${/* safe */ r.refundId}" placeholder="Mã GD ngân hàng..." style="padding:4px 8px; font-size:0.85rem; border:1px solid var(--border); border-radius:4px; width:140px;" />
                        <button class="btn btn-primary btn-sm" onclick="completeRefund('${/* safe */ r.refundId}')">Xác nhận đã chuyển</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

        container.innerHTML = `
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:25px;">
            <div style="background:var(--bg-secondary); padding:16px; border-radius:8px; border-left:4px solid #16a34a;">
              <div style="font-size:0.85rem; color:var(--text-muted);">Tổng tiền giữ đảm bảo (Escrow)</div>
              <div style="font-size:1.5rem; font-weight:700; color:#16a34a; margin-top:6px;">${/* safe */ formatTien(overview.escrowHeldAmount)}</div>
            </div>
            <div style="background:var(--bg-secondary); padding:16px; border-radius:8px; border-left:4px solid #3b82f6;">
              <div style="font-size:0.85rem; color:var(--text-muted);">Doanh thu hoa hồng (10%)</div>
              <div style="font-size:1.5rem; font-weight:700; color:#2563eb; margin-top:6px;">${/* safe */ formatTien(overview.platformRevenueAmount)}</div>
            </div>
            <div style="background:var(--bg-secondary); padding:16px; border-radius:8px; border-left:4px solid #ea580c;">
              <div style="font-size:0.85rem; color:var(--text-muted);">Tiền chờ hoàn cho khách</div>
              <div style="font-size:1.5rem; font-weight:700; color:#ea580c; margin-top:6px;">${/* safe */ formatTien(overview.refundPendingAmount)}</div>
            </div>
            <div style="background:var(--bg-secondary); padding:16px; border-radius:8px; border-left:4px solid #8b5cf6;">
              <div style="font-size:0.85rem; color:var(--text-muted);">Tổng đơn đã thanh toán</div>
              <div style="font-size:1.5rem; font-weight:700; color:#7c3aed; margin-top:6px;">${/* safe */ overview.totalPaidBookingsCount}</div>
            </div>
          </div>

          <div style="background:var(--bg-primary); border:1px solid var(--border); border-radius:8px; padding:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h3 style="margin:0;">Hàng đợi hoàn tiền (Refund Queue)</h3>
              <button class="btn btn-outline btn-sm" onclick="loadPaymentsOverview()">Làm mới</button>
            </div>
            ${/* safe */ refundRows}
          </div>
        `;
      } catch (err) {
        showError(err.message || 'Lỗi khi tải dữ liệu thanh toán & hoàn tiền.');
        container.innerHTML = '';
      }
    }

    async function completeRefund(refundId) {
      const refInput = document.getElementById(`ref-code-${refundId}`);
      const bankRef = refInput ? refInput.value.trim() : '';
      if (!bankRef) {
        showError('Vui lòng nhập mã giao dịch ngân hàng để đối soát.');
        return;
      }
      if (!confirm('Xác nhận bạn đã chuyển khoản hoàn tiền thành công cho khách hàng?')) return;

      try {
        await apiFetch(`/admin/refunds/${refundId}/complete`, {
          method: 'POST',
          body: JSON.stringify({ bankTransactionRef: bankRef })
        });
        showToast('Đã xác nhận hoàn tất hoàn tiền!', 3000, '✅');
        loadPaymentsOverview();
      } catch (err) {
        showError(err.message || 'Lỗi khi xác nhận hoàn tiền.');
      }
    }
  </script>
</body>
</html>
