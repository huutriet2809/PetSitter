<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tìm Pet-sitter | PawStay Đà Nẵng</title>
  <meta name="description" content="Tìm pet-sitter uy tín tại Đà Nẵng: Hải Châu, Sơn Trà, Thanh Khê... Tất cả đã xác minh CCCD. Giá từ 150,000đ/ngày." />
  <meta property="og:title"       content="Tìm Pet-sitter tại Đà Nẵng | PawStay" />
  <meta property="og:description" content="Hơn 60 sitter đã xác minh tại Đà Nẵng. Giá từ 140,000đ/ngày." />
  <meta property="og:type"        content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
  <link rel="stylesheet" href="assets/style.css?v=4" />
  <style>
    /* =====================================================
       TRANG DANH SÁCH SITTER - Style riêng
       ===================================================== */

    /* --- PAGE HEADER --- */
    .page-header {
      padding: 60px 20px 40px;
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      border-bottom: 1px solid var(--border);
    }

    .page-header h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* --- FILTER BAR --- */
    .filter-bar {
      padding: 24px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: var(--navbar-h); /* Chiều cao navbar từ CSS variable */
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .filter-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* Nút filter khu vực */
    .filter-btn {
      padding: 7px 16px;
      border-radius: 50px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(201,123,132,0.3);
    }

    /* Thông báo số lượng kết quả */
    .results-count {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* --- SITTER GRID --- */
    .sitters-section {
      padding: 40px 20px 80px;
    }

    .sitters-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    /* --- SITTER CARD --- */
    .sitter-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .sitter-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 0 1px var(--border-accent);
    }

    /* Phần ảnh đại diện */
    .sitter-avatar-wrap {
      position: relative;
      height: 200px;
      overflow: hidden;
    }

    .sitter-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .sitter-card:hover .sitter-avatar-img {
      transform: scale(1.05);
    }

    /* Placeholder khi ảnh lỗi */
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 800;
      color: rgba(0,0,0,0.35);
    }

    /* Badge xác minh ở góc ảnh */
    .verified-overlay {
      position: absolute;
      top: 12px;
      right: 12px;
    }

    /* Gradient phía dưới ảnh */
    .avatar-gradient {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(transparent, var(--bg-card));
    }

    /* Phần thông tin sitter */
    .sitter-info {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Tên + khu vực */
    .sitter-name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .sitter-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .sitter-area {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    /* Hàng rating + lượt nhận */
    .sitter-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .sitter-rating-text {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    .sitter-trips {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 50px;
    }

    /* Mô tả ngắn */
    .sitter-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 16px;
      flex: 1;

      /* Giới hạn 2 dòng */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Loại pet hỗ trợ */
    .sitter-pets {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .pet-tag {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 50px;
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* Hàng giá + nút đặt lịch */
    .sitter-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .sitter-price {
      display: flex;
      flex-direction: column;
    }

    .price-amount {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-light);
    }

    .price-unit {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Trạng thái "không có sitter nào" */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state-text { font-size: 1rem; }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      .sitters-grid {
        grid-template-columns: 1fr;
      }
      .filter-inner {
        gap: 8px;
      }
      .results-count { display: none; }
    }
  </style>
</head>
<body>

  <!-- Navbar được inject bởi components.js -->

  <!-- ===================== PAGE HEADER ===================== -->
  <div class="page-header">
    <div class="container">
      <p class="section-label">Danh sách pet-sitter</p>
      <h1>Tìm người trông thú cưng<br />phù hợp với bạn</h1>
      <p>Tất cả sitter đã được xác minh danh tính · Đặt lịch nhanh trong 3 phút</p>
    </div>
  </div>

  <!-- ===================== FILTER BAR ===================== -->
  <div class="filter-bar">
    <div class="filter-inner">
      <span class="filter-label">Khu vực:</span>
      <!-- Nút filter, data-area = giá trị lọc, "all" = tất cả -->
      <button class="filter-btn active" data-area="all" id="filter-all">Tất cả</button>
      <button class="filter-btn" data-area="Hải Châu">Hải Châu</button>
      <button class="filter-btn" data-area="Sơn Trà">Sơn Trà</button>
      <button class="filter-btn" data-area="Thanh Khê">Thanh Khê</button>
      <button class="filter-btn" data-area="Liên Chiểu">Liên Chiểu</button>
      <button class="filter-btn" data-area="Ngũ Hành Sơn">Ngũ Hành Sơn</button>
      <button class="filter-btn" data-area="Cẩm Lệ">Cẩm Lệ</button>
      <span class="results-count" id="results-count"></span>
    </div>
  </div>

  <!-- ===================== SITTER GRID ===================== -->
  <section class="sitters-section">
    <div class="sitters-grid" id="sitters-grid">
      <!-- Các card sitter sẽ được render bởi JavaScript -->
    </div>
  </section>

  <!-- Footer và Toast được inject bởi components.js -->

  <!-- ===================== JAVASCRIPT ===================== -->
  <!-- Load shared scripts -->
  <script src="assets/data.js?v=4"></script>
  <script src="assets/api.js?v=4"></script>
  <script src="assets/components.js?v=4"></script>
  <script>
    // Hàm tạo HTML cho một sitter card
    function taoSitterCard(sitter) {
      // Tạo URL ảnh giả dùng initials + màu nền
      const initials = getInitials(sitter.ten);

      // Render sao rating
      const ratingHtml = renderSao(sitter.danhGia);

      // Render các loại pet hỗ trợ
      const petTags = (sitter.tags || []).map(p =>
        `<span class="pet-tag">${/* safe */ p === 'Chó' ? '🐶' : p === 'Mèo' ? '🐱' : '🐾'} ${escapeHtml(p)}</span>`
      ).join('');

      return `
        <div class="sitter-card" id="sitter-${/* safe */ sitter.sitterId}" data-area="${escapeHtml(sitter.khuVuc)}"
             onclick="window.location='sitter-profile.html?id=${/* safe */ sitter.sitterId}'"
             role="article" aria-label="Sitter: ${escapeHtml(sitter.ten)}" style="cursor:pointer;">
          <!-- Ảnh đại diện -->
          <div class="sitter-avatar-wrap">
            ${/* safe */ (sitter.avatarUrl && (sitter.avatarUrl.startsWith("https://") || sitter.avatarUrl.startsWith("/"))) ? `<img src="${/* safe */ sitter.avatarUrl}" class="sitter-avatar-img">` : `<div class="avatar-placeholder" style="background:linear-gradient(135deg,var(--accent)55,var(--accent)22);transition:transform 0.4s ease;">${/* safe */ initials}</div>`}
            <div class="avatar-gradient"></div>
            ${/* safe */ sitter.noiBat ? '<div class="verified-overlay"><span class="badge badge-verified">✓ Đã xác minh</span></div>' : ''}
          </div>

          <!-- Thông tin sitter -->
          <div class="sitter-info">
            <div class="sitter-name">${escapeHtml(sitter.ten)}</div>
            <div class="sitter-area"><span>📍 </span><span>${escapeHtml(sitter.khuVuc)}, Đà Nẵng</span></div>

            <div class="sitter-meta">
              ${/* safe */ ratingHtml}
              <span class="sitter-rating-text">${/* safe */ sitter.danhGia}</span>
              <span class="sitter-trips">✓ ${/* safe */ sitter.soDanhGia} lượt nhận</span>
            </div>

            <p class="sitter-desc">${escapeHtml(sitter.moTaNgan)}</p>
            <div class="sitter-pets">${/* safe */ petTags}</div>

            <div class="sitter-footer">
              <div class="sitter-price">
                <span class="price-amount">${formatTien(sitter.giaTu)}</span>
                <span class="price-unit">mỗi ngày</span>
              </div>
              <button class="btn btn-primary btn-sm"
                      onclick="event.stopPropagation();datLich('${/* safe */ sitter.sitterId}')"
                      id="book-btn-${/* safe */ sitter.sitterId}">
                Đặt lịch
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Hàm render tất cả sitter lên grid
    function renderSitters(danhSach) {
      const grid = document.getElementById('sitters-grid');
      const countEl = document.getElementById('results-count');

      if (danhSach.length === 0) {
        // Hiển thị trạng thái trống
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <p class="empty-state-text">Chưa có sitter ở khu vực này.<br/>Vui lòng chọn khu vực khác.</p>
          </div>
        `;
        countEl.textContent = '0 sitter';
      } else {
        grid.innerHTML = danhSach.map(taoSitterCard).join('');
        countEl.textContent = `${danhSach.length} sitter`;
      }
    }

    // Hàm xử lý khi click nút "Đặt lịch"
    function datLich(sitterId) {
      localStorage.setItem('pawstay_selected_sitter', sitterId);
      window.location.href = 'booking.html';
    }

    // Hàm lọc theo khu vực
    async function loc(area) {
      try {
        let url = '/sitters';
        if (area !== 'all') {
            url += '?khuVuc=' + encodeURIComponent(area);
        }
        const data = await apiFetch(url);
        renderSitters(data);
      } catch(err) {
        console.error(err);
      }
    }

    // Gắn sự kiện cho các nút filter
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        // Xoá active của tất cả nút
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        // Thêm active cho nút được click
        this.classList.add('active');
        // Lọc và render lại
        loc(this.dataset.area);
      });
    });

    // === KHỞI TẠO: Đọc ?area= từ URL khi trang load ===
    const urlParams = new URLSearchParams(window.location.search);
    const initialArea = urlParams.get('area') || 'all';

    // Cập nhật active cho nút filter tương ứng
    let matchedBtn = null;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('active');
      if (b.dataset.area === initialArea) {
        matchedBtn = b;
      }
    });

    if (matchedBtn) {
      matchedBtn.classList.add('active');
    } else {
      const allBtn = document.querySelector('.filter-btn[data-area="all"]');
      if (allBtn) allBtn.classList.add('active');
    }

    loc(initialArea);
  </script>
</body>
</html>
