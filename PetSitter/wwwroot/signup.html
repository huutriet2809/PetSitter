<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- ===== SEO ===== -->
  <title>Đăng ký tài khoản | PawStay</title>
  <meta name="description" content="Đăng ký tài khoản PawStay để tìm kiếm người trông thú cưng uy tín hoặc ứng tuyển trở thành pet-sitter tại Đà Nẵng." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/style.css?v=4" />
  
  <style>
    /* =====================================================
       PAGE-SPECIFIC STYLES: SIGNUP PAGE (v2)
       ===================================================== */
    .auth-wrapper {
      padding: 60px 24px 80px;
      min-height: calc(100vh - var(--navbar-h) - 300px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-card);
      animation: fadeSlideUp 0.5s ease both;
    }

    @media (max-width: 500px) {
      .auth-card {
        padding: 30px 20px;
      }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header .logo-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
      display: inline-block;
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    /* Controls */
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--bg-secondary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 0.92rem;
      transition: all var(--transition);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: var(--bg-primary);
    }

    .password-wrap {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      transition: color var(--transition);
      user-select: none;
    }

    .password-toggle:hover {
      color: var(--accent);
    }

    /* Custom Checkbox */
    .terms-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
      user-select: none;
      margin-top: 10px;
    }

    .terms-option input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      margin-top: 16px;
    }

    /* Link footers */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .auth-link {
      color: var(--accent-light);
      font-weight: 600;
      transition: color var(--transition);
    }

    .auth-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ===================== MAIN LAYOUT ===================== -->
  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Card Header -->
      <header class="auth-header">
        <span class="logo-icon" aria-hidden="true">🐾</span>
        <h1 class="auth-title">Đăng ký tài khoản</h1>
        <p class="auth-subtitle">Tham gia cộng đồng gửi trông thú cưng PawStay tại Đà Nẵng</p>
      </header>

      <!-- Form signup -->
      <form id="signup-form" novalidate>
        
        <!-- Họ và tên -->
        <div class="form-group">
          <label for="signup-name">Họ và tên</label>
          <input type="text" id="signup-name" placeholder="Nhập họ và tên..." required />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="signup-email">Địa chỉ Email</label>
          <input type="email" id="signup-email" placeholder="example@gmail.com" required />
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
          <label for="signup-password">Mật khẩu (ít nhất 8 ký tự)</label>
          <div class="password-wrap">
            <input type="password" id="signup-password" minlength="8" placeholder="Tạo mật khẩu (tối thiểu 8 ký tự)..." required />
            <button type="button" class="password-toggle" id="btn-toggle-pwd" aria-label="Hiện mật khẩu">
              👁️
            </button>
          </div>
        </div>

        <!-- Xác nhận mật khẩu -->
        <div class="form-group">
          <label for="signup-confirm">Xác nhận mật khẩu</label>
          <div class="password-wrap">
            <input type="password" id="signup-confirm" minlength="8" placeholder="Xác nhận mật khẩu..." required />
            <button type="button" class="password-toggle" id="btn-toggle-confirm" aria-label="Hiện mật khẩu xác nhận">
              👁️
            </button>
          </div>
        </div>

        <!-- Điều khoản sử dụng -->
        <label class="terms-option">
          <input type="checkbox" id="signup-terms" required />
          <span>Tôi đồng ý với các <a href="terms.html" class="auth-link">Điều khoản dịch vụ</a> và <a href="privacy.html" class="auth-link">Chính sách bảo mật</a> của PawStay.</span>
        </label>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary submit-btn">
          Đăng ký tài khoản
        </button>

      </form>

      <!-- Footer navigation -->
      <footer class="auth-footer">
        Bạn đã có tài khoản? 
        <a href="login.html" class="auth-link">Đăng nhập ngay</a>
      </footer>

    </div>
  </main>

  <!-- ===================== JAVASCRIPT ===================== -->
  <script src="assets/api.js?v=4"></script>
  <script src="assets/data.js?v=4"></script>
  <script src="assets/components.js?v=4"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const pwdInput = document.getElementById('signup-password');
      const confirmInput = document.getElementById('signup-confirm');
      const togglePwdBtn = document.getElementById('btn-toggle-pwd');
      const toggleConfirmBtn = document.getElementById('btn-toggle-confirm');
      const form = document.getElementById('signup-form');

      // Toggle ẩn/hiện mật khẩu chính
      togglePwdBtn.addEventListener('click', function() {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        this.textContent = isPwd ? '🙈' : '👁️';
        this.setAttribute('aria-label', isPwd ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      });

      // Toggle ẩn/hiện mật khẩu xác nhận
      toggleConfirmBtn.addEventListener('click', function() {
        const isPwd = confirmInput.type === 'password';
        confirmInput.type = isPwd ? 'text' : 'password';
        this.textContent = isPwd ? '🙈' : '👁️';
        this.setAttribute('aria-label', isPwd ? 'Ẩn mật khẩu' : 'Hiện mật khẩu xác nhận');
      });

      // Submit đăng ký
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = pwdInput.value;
        const confirm = confirmInput.value;
        const termsChecked = document.getElementById('signup-terms').checked;

        // Validation các trường trống
        if (!name || !email || !password || !confirm) {
          showToast('Vui lòng điền đầy đủ tất cả thông tin! ⚠️', 2500, '❌');
          return;
        }

        // Validation độ dài mật khẩu
        if (password.length < 8) {
          showToast('Mật khẩu phải chứa ít nhất 8 ký tự! ⚠️', 2500, '❌');
          return;
        }

        // Validation trùng khớp mật khẩu
        if (password !== confirm) {
          showToast('Mật khẩu xác nhận không khớp! Vui lòng thử lại. ⚠️', 2500, '❌');
          return;
        }

        // Validation điều khoản
        if (!termsChecked) {
          showToast('Vui lòng đồng ý với các Điều khoản & Chính sách! ⚠️', 2500, '❌');
          return;
        }

        try {
                    const data = await apiFetch('/auth/register', {
            method: 'POST',
            body: JSON.stringify({ fullName: name, email: email, password: password })
          });

          localStorage.setItem('pawstay_token', data.token);

          // Get user info
          const me = await apiFetch('/auth/me');
          const realUser = {
            userId: me.userId,
            fullName: me.fullName,
            email: me.email,
            role: me.role,
            phone: me.phone,
            avatarUrl: me.avatarUrl || (typeof getInitials === 'function' ? getInitials(me.fullName || 'US') : 'US'),
            id: me.userId,
            ten: me.fullName
          };
          localStorage.setItem('pawstay_user', JSON.stringify(realUser));

          localStorage.setItem('pawstay_toast_on_load', JSON.stringify({
            message: "Đăng ký tài khoản thành công! Chào mừng " + realUser.fullName + " gia nhập PawStay 🐾",
            type: 'success',
            icon: '🐾'
          }));

          window.location.href = 'index.html';
        } catch (error) {
          showToast(error.message, 2500, '❌');
        }
      });
    });
  </script>
</body>
</html>
