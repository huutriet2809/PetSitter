<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- ===== SEO ===== -->
  <title>Đăng ký tài khoản | PawStay</title>
  <meta name="description" content="Đăng ký tài khoản PawStay để tìm kiếm người trông thú cưng uy tín hoặc ứng tuyển trở thành pet-sitter tại Đà Nẵng." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/style.css?v=4" />
  <link rel="stylesheet" href="css/signup.css?v=1" />
</head>
<body>

  <!-- ===================== MAIN LAYOUT ===================== -->
  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Card Header -->
      <header class="auth-header">
        <span class="logo-icon" aria-hidden="true">🐾</span>
        <h1 class="auth-title">Đăng ký tài khoản</h1>
        <p class="auth-subtitle">Tham gia cộng đồng gửi trông thú cưng PawStay tại Đà Nẵng</p>
      </header>

      <!-- Form signup -->
      <form id="signup-form" novalidate>
        
        <!-- Họ và tên -->
        <div class="form-group">
          <label for="signup-name">Họ và tên</label>
          <input type="text" id="signup-name" placeholder="Nhập họ và tên..." required />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="signup-email">Địa chỉ Email</label>
          <input type="email" id="signup-email" placeholder="example@gmail.com" required />
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
          <label for="signup-password">Mật khẩu (ít nhất 8 ký tự)</label>
          <div class="password-wrap">
            <input type="password" id="signup-password" minlength="8" placeholder="Tạo mật khẩu (tối thiểu 8 ký tự)..." required />
            <button type="button" class="password-toggle" id="btn-toggle-pwd" aria-label="Hiện mật khẩu">
              👁️
            </button>
          </div>
        </div>

        <!-- Xác nhận mật khẩu -->
        <div class="form-group">
          <label for="signup-confirm">Xác nhận mật khẩu</label>
          <div class="password-wrap">
            <input type="password" id="signup-confirm" minlength="8" placeholder="Xác nhận mật khẩu..." required />
            <button type="button" class="password-toggle" id="btn-toggle-confirm" aria-label="Hiện mật khẩu xác nhận">
              👁️
            </button>
          </div>
        </div>

        <!-- Điều khoản sử dụng -->
        <label class="terms-option">
          <input type="checkbox" id="signup-terms" required />
          <span>Tôi đồng ý với các <a href="terms.html" class="auth-link">Điều khoản dịch vụ</a> và <a href="privacy.html" class="auth-link">Chính sách bảo mật</a> của PawStay.</span>
        </label>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary submit-btn">
          Đăng ký tài khoản
        </button>

      </form>

      <!-- Footer navigation -->
      <footer class="auth-footer">
        Bạn đã có tài khoản? 
        <a href="login.html" class="auth-link">Đăng nhập ngay</a>
      </footer>

    </div>
  </main>

  <!-- ===================== JAVASCRIPT ===================== -->
  <script src="assets/api.js?v=4"></script>
  <script src="assets/data.js?v=4"></script>
  <script src="assets/components.js?v=4"></script>
  <script src="js/signup.js?v=1" defer></script>
</body>
</html>
