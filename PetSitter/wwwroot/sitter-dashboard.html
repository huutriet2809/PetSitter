<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitter Dashboard - PawStay</title>
  <link rel="stylesheet" href="assets/style.css?v=4">
  <style>
    .dashboard-container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab { padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; }
    .tab.active { border-bottom-color: var(--primary); color: var(--primary); font-weight: 600; }
    
    .booking-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 15px; }
    .booking-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .status-pending { background: rgba(234, 179, 8, 0.1); color: #eab308; }
    .status-accepted { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .status-completed { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
    .status-completion-pending { background: rgba(168, 85, 247, 0.1); color: #a855f7; }
    .status-disputed { background: rgba(249, 115, 22, 0.1); color: #ea580c; }
    .status-cancelled, .status-rejected { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .status-expired { background: rgba(107, 114, 128, 0.1); color: #6b7280; }

    .action-group { margin-top: 15px; display: flex; gap: 10px; }
    .reject-wrap { margin-top: 10px; display: none; }
    .reject-wrap input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-secondary); color: var(--text-primary); }
    #error-msg { background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 4px; display: none; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0;">Sitter Dashboard</h1>
        <div style="display: flex; gap: 10px;">
            <a href="sitter-edit.html" class="btn btn-outline">Hồ sơ Sitter</a>
            <a href="sitter-calendar.html" class="btn btn-primary">Lịch rảnh</a>
        </div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="loadBookings('PENDING', this)">Chờ xác nhận</div>
      <div class="tab" onclick="loadBookings('ACCEPTED', this)">Đang/Sắp thực hiện</div>
      <div class="tab" onclick="loadBookings('COMPLETION_PENDING', this)">Chờ chủ duyệt</div>
      <div class="tab" onclick="loadBookings('COMPLETED', this)">Đã hoàn thành</div>
      <div class="tab" onclick="loadBookings('DISPUTED', this)">Tranh chấp</div>
      <div class="tab" onclick="loadBookings('', this)">Tất cả</div>
      <div class="tab" id="tab-earnings" onclick="loadEarnings(this)">💰 Thu nhập & Ví</div>
    </div>
    
    <div id="error-msg"></div>
    <div id="booking-list">Đang tải...</div>
  </div>

  <script src="assets/api.js?v=4"></script>
  <script src="assets/data.js?v=4"></script>
  <script src="assets/components.js?v=4"></script>
  <script>
    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    function formatTien(amount) {
      return (amount || 0).toLocaleString('vi-VN') + ' đ';
    }

    function formatNgayDep(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString('vi-VN');
    }

    function getStatusLabel(status) {
      switch (status) {
        case 'PENDING': return 'Chờ xác nhận';
        case 'ACCEPTED': return 'Đã xác nhận';
        case 'COMPLETION_PENDING': return 'Chờ chủ xác nhận';
        case 'COMPLETED': return 'Đã hoàn thành';
        case 'DISPUTED': return 'Đang tranh chấp';
        case 'CANCELLED': return 'Đã hủy';
        case 'REJECTED': return 'Từ chối';
        case 'EXPIRED': return 'Đã hết hạn';
        default: return status || '';
      }
    }

    function formatTimeRemaining(isoDate) {
      if (!isoDate) return '';
      const diffMs = new Date(isoDate).getTime() - Date.now();
      if (diffMs <= 0) return 'Đã hết hạn xác nhận';
      const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      if (days > 0) return `còn ${days} ngày ${hours} giờ`;
      const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      return `còn ${hours} giờ ${minutes} phút`;
    }

    window.addEventListener('pageshow', (e) => {
      if (!localStorage.getItem('pawstay_token')) {
        window.location.replace('login.html');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('pawstay_token')) {
        window.location.href = 'login.html';
        return;
      }
      const user = typeof getCurrentUser === 'function' ? getCurrentUser() : JSON.parse(localStorage.getItem('pawstay_user') || 'null');
      const role = (user && user.role ? user.role : '').toUpperCase();
      if (role !== 'SITTER') {
        window.location.href = role === 'ADMIN' ? 'admin.html' : 'owner-dashboard.html';
        return;
      }
      renderNavbar();
      renderFooter();
      const urlParams = new URLSearchParams(window.location.search);
      const targetBookingId = urlParams.get('bookingId');
      if (targetBookingId) {
        const tabs = document.querySelectorAll('.tab');
        const allTab = tabs[tabs.length - 1]; // Tab 'Tất cả'
        loadBookings('', allTab);
      } else {
        loadBookings('PENDING');
      }
    });

    async function loadBookings(status, tabElement) {
      if (tabElement) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tabElement.classList.add('active');
      }

      const container = document.getElementById('booking-list');
      container.innerHTML = 'Đang tải...';

      try {
        const url = status ? `/sitter/bookings?status=${status}` : '/sitter/bookings';
        const bookings = await apiFetch(url);
        
        if (bookings.length === 0) {
          container.innerHTML = '<p>Không có yêu cầu nào.</p>';
          return;
        }

        container.innerHTML = bookings.map(b => {
          let actionHtml = '';
          const vnTodayStr = new Date(Date.now() + 7 * 3600000).toISOString().split('T')[0];
          const endVnStr = new Date(new Date(b.ngayKetThuc).getTime() + 7 * 3600000).toISOString().split('T')[0];
          const isPastEnd = endVnStr < vnTodayStr;

          if (b.trangThai === 'PENDING') {
            actionHtml = `
              <div class="action-group">
                <button class="btn btn-primary btn-sm" onclick="acceptBooking('${/* safe */ b.bookingId}')">Chấp nhận</button>
                <button class="btn btn-outline btn-sm" onclick="showReject('${/* safe */ b.bookingId}')">Từ chối</button>
              </div>
              <div class="reject-wrap" id="reject-${/* safe */ b.bookingId}">
                <input type="text" id="lydo-${/* safe */ b.bookingId}" placeholder="Nhập lý do từ chối (tối đa 500 ký tự)..." maxlength="500" />
                <button class="btn btn-outline btn-sm" onclick="rejectBooking('${/* safe */ b.bookingId}')">Xác nhận từ chối</button>
              </div>
            `;
          } else if (b.trangThai === 'ACCEPTED') {
            const canCancel = new Date(b.ngayBatDau).getTime() > Date.now();
            actionHtml = `
              <div class="action-group" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <a href="stay-updates.html?bookingId=${/* safe */ b.bookingId}" class="btn btn-outline btn-sm">Nhật ký chăm sóc</a>
                ${isPastEnd 
                  ? `<button class="btn btn-primary btn-sm" onclick="completeBooking('${/* safe */ b.bookingId}')">Đánh dấu hoàn tất</button>`
                  : `<button class="btn btn-primary btn-sm" disabled style="opacity:0.6; cursor:not-allowed;" title="Chỉ có thể đánh dấu sau ngày kết thúc lưu trú">Đánh dấu hoàn tất (chưa qua ngày kết thúc)</button>`
                }
                ${canCancel ? `<button class="btn btn-outline btn-sm" style="color:#ef4444; border-color:#ef4444;" onclick="showSitterCancel('${/* safe */ b.bookingId}')">Hủy nhận đơn</button>` : ''}
              </div>
              <div class="reject-wrap" id="cancel-${/* safe */ b.bookingId}">
                <input type="text" id="cancel-reason-${/* safe */ b.bookingId}" placeholder="Nhập lý do hủy (bắt buộc, tối đa 500 ký tự)..." maxlength="500" />
                <button class="btn btn-outline btn-sm" onclick="sitterCancelBooking('${/* safe */ b.bookingId}')">Xác nhận hủy</button>
              </div>
            `;
          } else if (b.trangThai === 'COMPLETION_PENDING') {
            const timeRem = formatTimeRemaining(b.completionDeadline);
            actionHtml = `
              <div style="margin-top: 15px; padding: 10px; background: rgba(168, 85, 247, 0.08); border-radius: 6px; font-size: 0.9rem; color: #7e22ce;">
                <strong>⏳ Chờ chủ xác nhận hoàn tất:</strong> ${escapeHtml(timeRem)} (hạn chót: ${formatNgayDep(b.completionDeadline)})
              </div>
            `;
          } else if (b.trangThai === 'DISPUTED') {
            actionHtml = `
              <div style="margin-top: 15px; padding: 10px; background: rgba(249, 115, 22, 0.08); border-radius: 6px; font-size: 0.9rem; color: #c2410c;">
                <strong>⚠️ Đơn đang tranh chấp:</strong> Đang chờ Quản trị viên can thiệp xử lý.
                ${/* safe */ b.disputeReason ? `<br/><em>Lý do chủ nuôi khiếu nại: ${escapeHtml(b.disputeReason)}</em>` : ''}
              </div>
            `;
          }

          let statusClass = 'status-pending';
          if (b.trangThai === 'ACCEPTED') statusClass = 'status-accepted';
          if (b.trangThai === 'COMPLETION_PENDING') statusClass = 'status-completion-pending';
          if (b.trangThai === 'COMPLETED') statusClass = 'status-completed';
          if (b.trangThai === 'DISPUTED') statusClass = 'status-disputed';
          if (b.trangThai === 'CANCELLED' || b.trangThai === 'REJECTED') statusClass = 'status-rejected';
          if (b.trangThai === 'EXPIRED') statusClass = 'status-expired';

          let paymentBadge = '';
          if (b.paymentStatus === 'PENDING_PAYMENT') {
            paymentBadge = `<span class="status-badge" style="background:rgba(234, 179, 8, 0.15); color:#ca8a04; border:1px solid #ca8a04; margin-left:8px;">Chờ thanh toán</span>`;
          } else if (b.paymentStatus === 'HELD') {
            paymentBadge = `<span class="status-badge" style="background:rgba(22, 163, 74, 0.15); color:#16a34a; border:1px solid #16a34a; margin-left:8px;">Đã thanh toán (Escrow giữ)</span>`;
          } else if (b.paymentStatus === 'RELEASED') {
            paymentBadge = `<span class="status-badge" style="background:rgba(22, 163, 74, 0.15); color:#16a34a; border:1px solid #16a34a; margin-left:8px;">Đã giải ngân</span>`;
          } else if (b.paymentStatus === 'REFUND_PENDING') {
            paymentBadge = `<span class="status-badge" style="background:rgba(249, 115, 22, 0.15); color:#ea580c; border:1px solid #ea580c; margin-left:8px;">Đang hoàn tiền</span>`;
          } else if (b.paymentStatus === 'REFUNDED') {
            paymentBadge = `<span class="status-badge" style="background:rgba(100, 116, 139, 0.15); color:#64748b; border:1px solid #64748b; margin-left:8px;">Đã hoàn tiền</span>`;
          } else if (b.paymentStatus === 'PARTIALLY_REFUNDED') {
            paymentBadge = `<span class="status-badge" style="background:rgba(59, 130, 246, 0.15); color:#2563eb; border:1px solid #2563eb; margin-left:8px;">Hoàn một phần</span>`;
          } else if (b.paymentStatus === 'CANCELLED') {
            paymentBadge = `<span class="status-badge" style="background:rgba(107, 114, 128, 0.15); color:#6b7280; border:1px solid #6b7280; margin-left:8px;">Hủy thanh toán</span>`;
          }

          return `
            <div class="booking-card" id="card-${/* safe */ b.bookingId}">
              <div class="booking-header">
                <div>
                  <strong>Mã: ${escapeHtml(b.maDatLich)}</strong>
                </div>
                <div style="text-align:right;">
                  <span class="status-badge ${/* safe */ statusClass}">${escapeHtml(getStatusLabel(b.trangThai))}</span>
                  ${/* safe */ paymentBadge}
                </div>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                  <p><strong>Ngày:</strong> ${formatNgayDep(b.ngayBatDau)} - ${formatNgayDep(b.ngayKetThuc)} (${/* safe */ b.soNgay} ngày)</p>
                  <p><strong>Thú cưng:</strong> ${escapeHtml(b.pet?.tenPet || '')} (${escapeHtml(b.pet?.loaiPet || '')}, ${escapeHtml(b.pet?.kichCo || '')})</p>
                  ${/* safe */ b.ghiChu ? `<p><strong>Ghi chú:</strong> <em>${escapeHtml(b.ghiChu)}</em></p>` : ''}
                  ${/* safe */ (b.trangThai === 'PENDING' && b.expiresAt) ? `<p style="font-size:0.85rem; color:#eab308;"><strong>Hạn phản hồi:</strong> ${formatNgayDep(b.expiresAt)}</p>` : ''}
                </div>
                <div>
                  <p><strong>Chi phí ước tính:</strong> ${formatTien(b.tongTien)}</p>
                  <p style="font-size: 0.85rem; color: var(--text-muted);">(Bao gồm ${formatTien(b.giaSitter)} phí trông + ${formatTien(b.tongAddons)} phụ phí)</p>
                  ${/* safe */ b.lyDoTuChoi ? `<p style="color: #ef4444; margin-top: 5px;"><strong>Lý do:</strong> ${escapeHtml(b.lyDoTuChoi)}</p>` : ''}
                </div>
              </div>
              ${/* safe */ actionHtml}
            </div>
          `;
        }).join('');

        const urlParams = new URLSearchParams(window.location.search);
        const targetBookingId = urlParams.get('bookingId');
        if (targetBookingId) {
          const targetCard = document.getElementById(`card-${targetBookingId}`);
          if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetCard.classList.add('booking-highlight');
          }
        }
      } catch (err) {
        showError(err.message || 'Lỗi tải danh sách. Bạn có quyền Sitter không?');
        container.innerHTML = '';
      }
    }

    function showReject(id) {
      document.getElementById(`reject-${id}`).style.display = 'block';
    }

    function showSitterCancel(id) {
      document.getElementById(`cancel-${id}`).style.display = 'block';
    }

    async function acceptBooking(id) {
      try {
        const res = await apiFetch(`/sitter/bookings/${id}/accept`, { method: 'PATCH' });
        if (res && res.warning) {
          alert(res.warning);
        }
        loadBookings('PENDING', document.querySelector('.tab.active'));
      } catch (e) {
        showError(e.message);
      }
    }

    async function rejectBooking(id) {
      const reason = document.getElementById(`lydo-${id}`).value;
      if (!reason || !reason.trim()) {
        showError('Vui lòng nhập lý do từ chối.');
        return;
      }
      try {
        await apiFetch(`/sitter/bookings/${id}/reject`, {
          method: 'PATCH',
          body: JSON.stringify({ lyDo: reason.trim() })
        });
        loadBookings('PENDING', document.querySelector('.tab.active'));
      } catch (e) {
        showError(e.message);
      }
    }

    async function sitterCancelBooking(id) {
      const reasonInput = document.getElementById(`cancel-reason-${id}`);
      const reason = reasonInput ? reasonInput.value.trim() : '';
      if (!reason) {
        showError('Vui lòng nhập lý do hủy đơn.');
        return;
      }
      try {
        await apiFetch(`/sitter/bookings/${id}/cancel`, {
          method: 'PATCH',
          body: JSON.stringify({ lyDo: reason })
        });
        loadBookings('ACCEPTED', document.querySelector('.tab.active'));
      } catch (e) {
        showError(e.message);
      }
    }

    async function completeBooking(id) {
      try {
        await apiFetch(`/sitter/bookings/${id}/complete`, { method: 'PATCH' });
        loadBookings('ACCEPTED', document.querySelector('.tab.active'));
      } catch (e) {
        showError(e.message);
      }
    }

    async function loadEarnings(tabElement) {
      if (tabElement) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tabElement.classList.add('active');
      }
      const container = document.getElementById('booking-list');
      container.innerHTML = '<div style="text-align:center; padding:30px;">⏳ Đang tải thông tin thu nhập, ví và tài khoản ngân hàng...</div>';

      try {
        const [wallet, withdrawalsRes, historyRes] = await Promise.all([
          apiFetch('/wallet/summary'),
          apiFetch('/wallet/withdrawals'),
          apiFetch('/wallet/history')
        ]);

        const historyItems = historyRes || [];
        const withdrawals = withdrawalsRes || [];

        const typeLabels = {
          'BOOKING_PAYOUT': 'Thù lao trông giữ',
          'COMMISSION': 'Phí dịch vụ sàn',
          'DISPUTE_SPLIT': 'Hòa giải tranh chấp',
          'CANCEL_COMPENSATION': 'Bồi thường hủy đơn',
          'WITHDRAWAL': 'Rút tiền về tài khoản'
        };

        const statusLabels = {
          'REQUESTED': '<span class="status-badge" style="background:#fef3c7; color:#b45309;">Chờ duyệt</span>',
          'APPROVED': '<span class="status-badge" style="background:#dbeafe; color:#1d4ed8;">Đã duyệt</span>',
          'PROCESSING': '<span class="status-badge" style="background:#e0e7ff; color:#4338ca;">Đang xử lý</span>',
          'PAID': '<span class="status-badge" style="background:#dcfce7; color:#15803d;">Đã thanh toán</span>',
          'REJECTED': '<span class="status-badge" style="background:#fee2e2; color:#b91c1c;">Bị từ chối</span>',
          'CANCELLED': '<span class="status-badge" style="background:#f3f4f6; color:#6b7280;">Đã hủy</span>',
          'FAILED': '<span class="status-badge" style="background:#fee2e2; color:#b91c1c;">Thất bại</span>'
        };

        const historyHtml = historyItems.length === 0 
          ? '<p style="color:var(--text-muted); padding:16px 0;">Chưa có giao dịch biến động nào được ghi nhận.</p>'
          : `
            <div style="overflow-x:auto;">
              <table style="width:100%; border-collapse:collapse; font-size:0.9rem; margin-top:10px;">
                <thead>
                  <tr style="text-align:left; border-bottom:2px solid var(--border); color:var(--text-secondary);">
                    <th style="padding:10px 8px;">Thời gian</th>
                    <th style="padding:10px 8px;">Mã đơn</th>
                    <th style="padding:10px 8px;">Loại giao dịch</th>
                    <th style="padding:10px 8px;">Số tiền</th>
                    <th style="padding:10px 8px;">Trạng thái</th>
                  </tr>
                </thead>
                <tbody>
                  ${historyItems.map(item => {
                    const sign = item.direction === 'OUT' ? '-' : '+';
                    const color = item.direction === 'OUT' ? '#ef4444' : '#16a34a';
                    const timeStr = new Date(item.createdAt).toLocaleString('vi-VN');
                    const availableStr = item.isAvailable 
                      ? '<span style="color:#16a34a; font-weight:600;">✅ Sẵn sàng rút</span>' 
                      : `<span style="color:#d97706; font-size:0.85rem;">⏳ Tạm giữ (mở: ${/* safe */ item.availableAt ? new Date(item.availableAt).toLocaleString('vi-VN') : 'chờ'})</span>`;

                    return `
                      <tr style="border-bottom:1px solid var(--border);">
                        <td style="padding:10px 8px; color:var(--text-muted); font-size:0.85rem;">${/* safe */ timeStr}</td>
                        <td style="padding:10px 8px;"><strong>${escapeHtml(item.bookingId ? '#' + item.bookingId.substring(0, 8) : '—')}</strong></td>
                        <td style="padding:10px 8px;">${escapeHtml(typeLabels[item.type] || item.type)}</td>
                        <td style="padding:10px 8px; font-weight:700; color:${/* safe */ color};">${/* safe */ sign}${formatTien(Math.abs(item.amount))}</td>
                        <td style="padding:10px 8px;">${/* safe */ availableStr}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;

        const withdrawalsHtml = withdrawals.length === 0
          ? '<p style="color:var(--text-muted); padding:12px 0;">Bạn chưa có yêu cầu rút tiền nào.</p>'
          : `
            <div style="overflow-x:auto;">
              <table style="width:100%; border-collapse:collapse; font-size:0.9rem; margin-top:10px;">
                <thead>
                  <tr style="text-align:left; border-bottom:2px solid var(--border); color:var(--text-secondary);">
                    <th style="padding:10px 8px;">Mã yêu cầu</th>
                    <th style="padding:10px 8px;">Thời gian</th>
                    <th style="padding:10px 8px;">Số tiền rút</th>
                    <th style="padding:10px 8px;">Tài khoản nhận</th>
                    <th style="padding:10px 8px;">Trạng thái</th>
                    <th style="padding:10px 8px;">Thao tác</th>
                  </tr>
                </thead>
                <tbody>
                  ${withdrawals.map(w => {
                    const timeStr = new Date(w.createdAt).toLocaleString('vi-VN');
                    const cancelBtn = w.status === 'REQUESTED' 
                      ? `<button class="btn btn-outline btn-sm" style="color:#ef4444; border-color:#ef4444;" onclick="cancelWithdrawal('${/* safe */ w.withdrawalId}')">Hủy</button>` 
                      : (w.bankTransactionRef ? `<span style="font-size:0.8rem; color:var(--text-muted);">Mã GD: ${escapeHtml(w.bankTransactionRef)}</span>` : '—');
                    return `
                      <tr style="border-bottom:1px solid var(--border);">
                        <td style="padding:10px 8px;"><code>#${/* safe */ w.withdrawalId.substring(0, 8)}</code></td>
                        <td style="padding:10px 8px; color:var(--text-muted); font-size:0.85rem;">${/* safe */ timeStr}</td>
                        <td style="padding:10px 8px; font-weight:700; color:#16a34a;">${formatTien(w.amount)}</td>
                        <td style="padding:10px 8px; font-size:0.85rem;">${escapeHtml(w.bankName)} - <strong>${escapeHtml(w.accountNumberMasked)}</strong><br/><small style="color:var(--text-muted);">${escapeHtml(w.accountHolderName)}</small></td>
                        <td style="padding:10px 8px;">${/* safe */ statusLabels[w.status] || w.status}</td>
                        <td style="padding:10px 8px;">${/* safe */ cancelBtn}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;

        const bankInfo = wallet.bankAccount;
        const bankDisplayHtml = bankInfo && bankInfo.accountNumberMasked
          ? `
            <div style="background:var(--bg-secondary); border-radius:8px; padding:15px; border:1px solid var(--border); margin-bottom:15px;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:0.85rem; color:var(--text-muted);">Ngân hàng thụ hưởng</div>
                  <strong style="font-size:1.05rem;">${escapeHtml(bankInfo.bankName || '')}</strong>
                  <div style="font-size:1.1rem; font-weight:700; letter-spacing:1px; margin-top:4px;">${escapeHtml(bankInfo.accountNumberMasked)}</div>
                  <div style="font-size:0.9rem; color:var(--text-secondary); text-transform:uppercase;">${escapeHtml(bankInfo.accountHolderName || '')}</div>
                </div>
                <button class="btn btn-outline btn-sm" onclick="toggleBankEdit(true)">Thay đổi STK</button>
              </div>
              ${/* safe */ wallet.freezeUntil ? `<div style="margin-top:10px; padding:8px 12px; background:#fffbeb; color:#b45309; border-radius:6px; font-size:0.85rem;">🔒 Tài khoản đang trong thời gian đóng băng an toàn 24h sau khi cập nhật (mở lúc: ${new Date(wallet.freezeUntil).toLocaleString('vi-VN')}).</div>` : ''}
            </div>
          `
          : `
            <div style="background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:15px; margin-bottom:15px; color:#92400e;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <strong>⚠️ Chưa liên kết tài khoản ngân hàng</strong>
                  <div style="font-size:0.85rem; margin-top:4px;">Vui lòng cập nhật tài khoản ngân hàng chính chủ để có thể thực hiện rút tiền.</div>
                </div>
                <button class="btn btn-primary btn-sm" onclick="toggleBankEdit(true)">Cập nhật ngay</button>
              </div>
            </div>
          `;

        container.innerHTML = `
          <!-- Metric Cards -->
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:24px;">
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; border-left:4px solid #16a34a;">
              <span style="font-size:0.8rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">Số dư khả dụng</span>
              <h2 style="font-size:1.6rem; margin:6px 0 2px; color:#16a34a;">${formatTien(wallet.availableBalance || 0)}</h2>
              <span style="font-size:0.8rem; color:var(--text-muted);">Sẵn sàng rút về tài khoản</span>
            </div>
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; border-left:4px solid #f59e0b;">
              <span style="font-size:0.8rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">Đang tạm giữ (48h)</span>
              <h2 style="font-size:1.6rem; margin:6px 0 2px; color:#f59e0b;">${formatTien(wallet.pendingHoldBalance || 0)}</h2>
              <span style="font-size:0.8rem; color:var(--text-muted);">Tạm giữ đối soát sau chuyến đi</span>
            </div>
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; border-left:4px solid #6366f1;">
              <span style="font-size:0.8rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">Đang xử lý rút</span>
              <h2 style="font-size:1.6rem; margin:6px 0 2px; color:#6366f1;">${formatTien(wallet.reservedAmount || 0)}</h2>
              <span style="font-size:0.8rem; color:var(--text-muted);">Đang chờ Admin duyệt/chuyển khoản</span>
            </div>
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; border-left:4px solid #64748b;">
              <span style="font-size:0.8rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">Đã rút thành công</span>
              <h2 style="font-size:1.6rem; margin:6px 0 2px; color:#64748b;">${formatTien(wallet.withdrawnTotal || 0)}</h2>
              <span style="font-size:0.8rem; color:var(--text-muted);">Tổng số tiền đã nhận</span>
            </div>
          </div>

          <!-- Bank & Withdrawal Panel -->
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:20px; margin-bottom:24px;">
            <!-- Bank Account Card -->
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px;">
              <h3 style="margin-top:0; margin-bottom:15px; font-size:1.1rem;">🏦 Tài khoản ngân hàng thụ hưởng</h3>
              ${/* safe */ bankDisplayHtml}
              
              <!-- Update Bank Form (hidden by default) -->
              <div id="bank-edit-form" style="display:none; background:var(--bg-secondary); padding:16px; border-radius:8px; border:1px solid var(--border); margin-top:10px;">
                <h4 style="margin-top:0; margin-bottom:12px; font-size:0.95rem;">Cập nhật thông tin ngân hàng</h4>
                <div style="margin-bottom:10px;">
                  <label style="display:block; font-size:0.85rem; margin-bottom:4px; font-weight:600;">Tên ngân hàng (Vietcombank, MB, Techcombank,...)</label>
                  <input type="text" id="bank-input-name" placeholder="VD: MB Bank" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-card); color:var(--text-primary);" />
                </div>
                <div style="margin-bottom:10px;">
                  <label style="display:block; font-size:0.85rem; margin-bottom:4px; font-weight:600;">Số tài khoản</label>
                  <input type="text" id="bank-input-number" placeholder="VD: 0987654321" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-card); color:var(--text-primary);" />
                </div>
                <div style="margin-bottom:10px;">
                  <label style="display:block; font-size:0.85rem; margin-bottom:4px; font-weight:600;">Tên chủ tài khoản (viết hoa không dấu)</label>
                  <input type="text" id="bank-input-holder" placeholder="VD: NGUYEN VAN A" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-card); color:var(--text-primary);" />
                </div>
                <div style="margin-bottom:12px;">
                  <label style="display:block; font-size:0.85rem; margin-bottom:4px; font-weight:600;">Mật khẩu tài khoản (để xác thực bảo mật)</label>
                  <input type="password" id="bank-input-password" placeholder="Nhập mật khẩu PawStay của bạn" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-card); color:var(--text-primary);" />
                </div>
                <div style="font-size:0.8rem; color:#b45309; margin-bottom:12px;">⚠️ Lưu ý: Sau khi cập nhật, tài khoản sẽ bị đóng băng an toàn trong 24 giờ trước khi có thể rút tiền.</div>
                <div style="display:flex; gap:8px; justify-content:flex-end;">
                  <button class="btn btn-outline btn-sm" onclick="toggleBankEdit(false)">Hủy</button>
                  <button class="btn btn-primary btn-sm" onclick="saveBankAccount()">Lưu thông tin</button>
                </div>
              </div>
            </div>

            <!-- Withdraw Request Form Card -->
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px;">
              <h3 style="margin-top:0; margin-bottom:15px; font-size:1.1rem;">💸 Yêu cầu rút tiền</h3>
              <div style="margin-bottom:12px; font-size:0.85rem; color:var(--text-secondary);">
                <div>• Khả dụng rút ngay: <strong style="color:#16a34a;">${formatTien(wallet.availableBalance || 0)}</strong></div>
                <div>• Hạn mức ngày còn lại: <strong>${formatTien(wallet.dailyLimitRemaining || 0)}</strong> / 20.000.000 ₫</div>
                <div>• Mức rút tối thiểu: <strong>50.000 ₫/lần</strong></div>
              </div>
              <div style="margin-bottom:12px;">
                <label style="display:block; font-size:0.85rem; margin-bottom:4px; font-weight:600;">Số tiền muốn rút (₫)</label>
                <input type="number" id="withdraw-amount-input" min="50000" max="${/* safe */ wallet.availableBalance || 0}" step="10000" placeholder="VD: 500000" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-secondary); color:var(--text-primary); font-size:1.1rem; font-weight:600;" />
              </div>
              <div style="display:flex; gap:8px; margin-bottom:15px;">
                <button type="button" class="btn btn-outline btn-sm" onclick="setWithdrawAmount(${/* safe */ wallet.availableBalance || 0})">Rút tất cả (${formatTien(wallet.availableBalance || 0)})</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="setWithdrawAmount(500000)">500.000 ₫</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="setWithdrawAmount(1000000)">1.000.000 ₫</button>
              </div>
              <button class="btn btn-primary" style="width:100%; padding:10px;" onclick="submitWithdrawal()" ${/* safe */ (!wallet.canWithdraw || (wallet.availableBalance || 0) < 50000) ? 'disabled' : ''}>
                Gửi yêu cầu rút tiền
              </button>
              ${/* safe */ !wallet.canWithdraw ? `<div style="font-size:0.8rem; color:#ef4444; margin-top:8px;">${/* safe */ wallet.freezeUntil ? 'Tài khoản đang đóng băng 24h.' : 'Chưa đủ điều kiện rút tiền (cần thêm STK hoặc hết hạn mức ngày).'}</div>` : ''}
            </div>
          </div>

          <!-- Withdrawal Requests History -->
          <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px; margin-bottom:24px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:10px;">
              <h3 style="margin:0; font-size:1.1rem;">Danh sách yêu cầu rút tiền</h3>
              <span style="font-size:0.85rem; color:var(--text-muted);">${/* safe */ withdrawals.length} yêu cầu</span>
            </div>
            ${/* safe */ withdrawalsHtml}
          </div>

          <!-- Ledger History -->
          <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:10px;">
              <h3 style="margin:0; font-size:1.1rem;">Lịch sử biến động số dư ví</h3>
              <span style="font-size:0.85rem; color:var(--text-muted);">${/* safe */ historyItems.length} giao dịch</span>
            </div>
            ${/* safe */ historyHtml}
          </div>
        `;
      } catch (err) {
        showError(err.message || 'Lỗi tải thông tin thu nhập.');
        container.innerHTML = '<p>Không thể tải dữ liệu thu nhập & ví.</p>';
      }
    }

    function toggleBankEdit(show) {
      const el = document.getElementById('bank-edit-form');
      if (el) el.style.display = show ? 'block' : 'none';
    }

    function setWithdrawAmount(amt) {
      const el = document.getElementById('withdraw-amount-input');
      if (el) el.value = amt;
    }

    async function saveBankAccount() {
      const bankName = (document.getElementById('bank-input-name')?.value || '').trim();
      const accountNumber = (document.getElementById('bank-input-number')?.value || '').trim();
      const accountHolderName = (document.getElementById('bank-input-holder')?.value || '').trim();
      const password = (document.getElementById('bank-input-password')?.value || '').trim();

      if (!bankName || !accountNumber || !accountHolderName) {
        showError('Vui lòng điền đầy đủ tên ngân hàng, số tài khoản và tên chủ tài khoản.');
        return;
      }
      if (!password) {
        showError('Vui lòng nhập mật khẩu đăng nhập để xác nhận đổi tài khoản ngân hàng.');
        return;
      }

      try {
        await apiFetch('/wallet/bank-account', {
          method: 'PUT',
          body: JSON.stringify({ bankName, accountNumber, accountHolderName, password })
        });
        showToast('Đã lưu thông tin tài khoản ngân hàng thành công!', 3000, '✅');
        loadEarnings();
      } catch (err) {
        showError(err.message || 'Lỗi khi cập nhật tài khoản ngân hàng.');
      }
    }

    async function submitWithdrawal() {
      const input = document.getElementById('withdraw-amount-input');
      const amount = parseInt(input?.value || '0', 10);
      if (!amount || amount < 50000) {
        showError('Số tiền rút tối thiểu là 50.000 ₫.');
        return;
      }

      if (!confirm(`Xác nhận yêu cầu rút ${formatTien(amount)} về tài khoản ngân hàng của bạn?`)) return;

      const idempotencyKey = 'WTH_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
      try {
        await apiFetch('/wallet/withdraw', {
          method: 'POST',
          headers: { 'Idempotency-Key': idempotencyKey },
          body: JSON.stringify({ amount })
        });
        showToast('Đã gửi yêu cầu rút tiền thành công!', 3000, '✅');
        loadEarnings();
      } catch (err) {
        showError(err.message || 'Lỗi khi gửi yêu cầu rút tiền.');
      }
    }

    async function cancelWithdrawal(withdrawalId) {
      if (!confirm('Bạn có chắc chắn muốn hủy yêu cầu rút tiền này? Số tiền bị giữ sẽ được hoàn lại số dư khả dụng ngay lập tức.')) return;
      try {
        await apiFetch(`/wallet/withdrawals/${withdrawalId}/cancel`, { method: 'POST' });
        showToast('Đã hủy yêu cầu rút tiền thành công!', 3000, '✅');
        loadEarnings();
      } catch (err) {
        showError(err.message || 'Lỗi khi hủy yêu cầu rút tiền.');
      }
    }
  </script>
</body>
</html>
