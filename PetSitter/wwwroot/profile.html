<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản cá nhân | PawStay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .profile-container { max-width: 800px; margin: 100px auto; padding: 24px; }
    .card { background: var(--bg-card); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
    input { width: 100%; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-primary); }
    .btn-block { width: 100%; }
    .error { color: #ff5252; font-size: 0.85rem; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <div class="profile-container">
    <h1 style="margin-bottom: 24px;">Hồ sơ tài khoản</h1>

    <div class="card">
      <h3 style="margin-bottom: 20px;">Thông tin cá nhân</h3>
      <form id="profile-form">
        <div class="form-group">
          <label>Email (Không thể thay đổi)</label>
          <input type="email" id="email" disabled style="opacity: 0.6;" />
        </div>
        <div class="form-group">
          <label>Họ và tên *</label>
          <input type="text" id="name" required minlength="2" maxlength="60" />
        </div>
        <div class="form-group">
          <label>Số điện thoại *</label>
          <input type="text" id="phone" required pattern="^0[0-9]{9}$" placeholder="Ví dụ: 0912345678" />
        </div>
        <div class="form-group">
          <label>Đường dẫn Avatar (Tùy chọn)</label>
          <input type="url" id="avatarUrl" placeholder="https://..." pattern="^https://.*" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Cập nhật thông tin</button>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 20px;">Đổi mật khẩu</h3>
      <form id="password-form">
        <div class="form-group">
          <label>Mật khẩu hiện tại *</label>
          <input type="password" id="currentPassword" required />
          <div id="pwd-error" class="error"></div>
        </div>
        <div class="form-group">
          <label>Mật khẩu mới *</label>
          <input type="password" id="newPassword" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-outline btn-block">Đổi mật khẩu</button>
      </form>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/components.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await apiFetch('/auth/me');
        document.getElementById('email').value = user.email;
        document.getElementById('name').value = user.fullName;
        document.getElementById('phone').value = user.phone || '';
        document.getElementById('avatarUrl').value = user.avatarUrl || '';
      } catch (err) {
        showToast("Không tải được thông tin", 3000, "❌");
      }
    });

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        avatarUrl: document.getElementById('avatarUrl').value.trim()
      };
      
      try {
        await apiFetch('/auth/me', { method: 'PUT', body: JSON.stringify(payload) });
        
        // Cập nhật lại cache và navbar
        const user = await apiFetch('/auth/me');
        localStorage.setItem('pawstay_user', JSON.stringify(user));
        renderNavbar(); // Re-render
        
        showToast("Đã cập nhật thông tin thành công!", 3000, "✅");
      } catch (err) {
        showToast(err.message, 3000, "❌");
      }
    });

    document.getElementById('password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const errEl = document.getElementById('pwd-error');
      errEl.style.display = 'none';

      try {
        await apiFetch('/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({ currentPassword, newPassword }),
          suppressAuthError: true // prevent redirect on 401 just in case, though API returns 400
        });
        showToast("Đổi mật khẩu thành công!", 3000, "✅");
        e.target.reset();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
