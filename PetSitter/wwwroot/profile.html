<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản cá nhân | PawStay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
  <link rel="stylesheet" href="assets/style.css?v=4">
  <link rel="stylesheet" href="css/profile.css?v=1">
</head>
<body>
  <div class="profile-container">
    <h1 class="profile-title">Hồ sơ tài khoản</h1>

    <div class="card">
      <h3 class="card-title">Thông tin cá nhân</h3>
      <form id="profile-form">
        <div class="form-group">
          <label for="email">Email (Không thể thay đổi)</label>
          <input type="email" id="email" disabled />
        </div>
        <div class="form-group">
          <label for="name">Họ và tên *</label>
          <input type="text" id="name" required minlength="2" maxlength="60" />
        </div>
        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input type="text" id="phone" required pattern="^0[0-9]{9}$" placeholder="Ví dụ: 0912345678" />
        </div>
        <div class="form-group">
          <label for="avatarUrl">Đường dẫn Avatar (Tùy chọn)</label>
          <input type="url" id="avatarUrl" placeholder="https://..." pattern="^https://.*" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Cập nhật thông tin</button>
      </form>
    </div>

    <div class="card">
      <h3 class="card-title">Đổi mật khẩu</h3>
      <form id="password-form">
        <div class="form-group">
          <label for="currentPassword">Mật khẩu hiện tại *</label>
          <input type="password" id="currentPassword" required />
          <div id="pwd-error" class="error"></div>
        </div>
        <div class="form-group">
          <label for="newPassword">Mật khẩu mới *</label>
          <input type="password" id="newPassword" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-outline btn-block">Đổi mật khẩu</button>
      </form>
    </div>

    <div class="card security-card">
      <h3 class="security-card-title">Bảo mật & Phiên đăng nhập</h3>
      <p class="security-desc">
        Nếu bạn nghi ngờ tài khoản bị xâm nhập hoặc đã đăng nhập trên thiết bị lạ, bạn có thể chủ động đăng xuất khỏi tất cả các thiết bị ngay lập tức.
      </p>
      <button type="button" class="btn btn-outline btn-block btn-danger-outline" id="btn-logout-all">Đăng xuất tất cả thiết bị</button>
    </div>
  </div>

  <script src="assets/data.js?v=4"></script>
  <script src="assets/api.js?v=4"></script>
  <script src="assets/components.js?v=4"></script>
  <script src="js/profile.js?v=1" defer></script>
</body>
</html>
