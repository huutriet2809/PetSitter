<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ Sitter | PawStay Đà Nẵng</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .profile-wrapper { padding: 120px 24px 60px; max-width: 1000px; margin: 0 auto; }
    .profile-header { display: flex; gap: 24px; background: var(--bg-card); padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 24px; }
    .profile-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .profile-info h1 { margin-bottom: 8px; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .tag { background: var(--bg-secondary); padding: 4px 12px; border-radius: 16px; font-size: 0.8rem; }
    .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .content-grid { grid-template-columns: 1fr; } .profile-header { flex-direction: column; align-items: center; text-align: center; } }
    .section-card { background: var(--bg-card); padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 24px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-day-header { font-size: 0.8rem; color: var(--text-muted); padding: 8px 0; }
    .cal-day { padding: 12px 0; border-radius: 4px; font-size: 0.9rem; background: var(--bg-secondary); }
    .cal-day.available { background: rgba(46, 204, 113, 0.2); color: #2ecc71; font-weight: bold; }
    .review-item { border-bottom: 1px solid var(--border); padding: 16px 0; }
    .review-item:last-child { border-bottom: none; }
    .review-meta { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary); }
    .pagination { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }
  </style>
</head>
<body>
  <div class="profile-wrapper" id="content">
    <div style="text-align:center; padding: 40px;">Đang tải...</div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/components.js"></script>
  <script>
    let currentSitter = null;
    let allReviews = [];
    let currentReviewPage = 1;
    const REVIEWS_PER_PAGE = 10;
    
    let currentMonth = new Date();
    currentMonth.setUTCDate(1);

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sitterId = urlParams.get('id');
      if (!sitterId) {
        showError("Không tìm thấy mã sitter.");
        return;
      }
      try {
        currentSitter = await apiFetch(`/sitters/${sitterId}`);
        allReviews = await apiFetch(`/sitters/${sitterId}/reviews`);
        renderProfile();
      } catch (e) {
        showError(e.status === 404 ? "Sitter không tồn tại hoặc đã bị xóa." : "Lỗi tải thông tin.");
      }
    });

    function showError(msg) {
      document.getElementById('content').innerHTML = `<div style="text-align:center; padding: 40px;"><h2>Lỗi</h2><p>${escapeHtml(msg)}</p><a href="sitters.html" class="btn btn-primary mt-4">Tìm Sitter khác</a></div>`;
    }

    async function renderProfile() {
      const s = currentSitter;
      const avatar = (s.avatarUrl && (s.avatarUrl.startsWith("https://") || s.avatarUrl.startsWith("/"))) 
        ? `<img src="${/* safe */ s.avatarUrl}" class="profile-avatar" />` 
        : `<div class="profile-avatar">${getInitials(s.ten || "ST")}</div>`;
      
      const tags = (s.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      const basePrice = (s.dichVu && s.dichVu.length > 0) ? s.dichVu[0].gia : (s.giaMoiNgay || s.giaTu || 150000);
      
      const html = `
        <div class="profile-header">
          ${/* safe */ avatar}
          <div class="profile-info">
            <h1 id="sitter-name">${escapeHtml(s.ten)}</h1>
            <p>📍 ${escapeHtml(s.khuVuc || "Đà Nẵng")} | ⭐ ${/* safe */ s.danhGia || 5.0} (${/* safe */ s.soDanhGia || 0} đánh giá)</p>
            <div class="tags">${/* safe */ tags}</div>
          </div>
        </div>
        <div class="content-grid">
          <div class="left-col">
            <div class="section-card">
              <h3>Giới thiệu</h3>
              <p id="sitter-bio" style="white-space: pre-line; margin-top:12px; line-height: 1.6;">${escapeHtml(s.bio || "Chưa có giới thiệu.")}</p>
            </div>
            <div class="section-card">
              <h3>Đánh giá (${/* safe */ allReviews.length})</h3>
              <div id="reviews-container"></div>
              <div id="reviews-pagination" class="pagination"></div>
            </div>
          </div>
          <div class="right-col">
            <div class="section-card" style="text-align:center;">
              <h2 style="color:var(--accent);">${formatTien(basePrice)} <span style="font-size:1rem; color:var(--text-muted); font-weight:normal;">/ ngày</span></h2>
              <button class="btn btn-primary" style="width:100%; margin-top:16px;" onclick="bookSitter()">Đặt lịch ngay</button>
            </div>
            <div class="section-card">
              <h3>Dịch vụ bổ sung</h3>
              <ul style="margin-top:12px; padding-left:20px; line-height:1.6;" id="services-list">
              </ul>
            </div>
            <div class="section-card">
              <div class="calendar-header">
                <button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)">◀</button>
                <h4 id="cal-month"></h4>
                <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">▶</button>
              </div>
              <div class="calendar-grid">
                <div class="cal-day-header">CN</div><div class="cal-day-header">T2</div>
                <div class="cal-day-header">T3</div><div class="cal-day-header">T4</div>
                <div class="cal-day-header">T5</div><div class="cal-day-header">T6</div>
                <div class="cal-day-header">T7</div>
              </div>
              <div class="calendar-grid" id="cal-days"></div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('content').innerHTML = html;
      
      const sList = document.getElementById('services-list');
      if (s.dichVu && s.dichVu.length > 0) {
        s.dichVu.forEach(srv => {
            const li = document.createElement('li');
            li.textContent = `${srv.ten} (+ ${formatTien(srv.gia)})`;
            sList.appendChild(li);
        });
      } else {
        sList.innerHTML = '<li style="color:var(--text-muted);">Không có dịch vụ phụ</li>';
      }

      renderReviews();
      loadCalendar();
    }

    function renderReviews() {
      const container = document.getElementById('reviews-container');
      const pContainer = document.getElementById('reviews-pagination');
      container.innerHTML = ''; pContainer.innerHTML = '';
      
      const totalPages = Math.ceil(allReviews.length / REVIEWS_PER_PAGE);
      if (allReviews.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); margin-top:12px;">Chưa có đánh giá nào.</p>';
        return;
      }

      const start = (currentReviewPage - 1) * REVIEWS_PER_PAGE;
      const end = start + REVIEWS_PER_PAGE;
      const pageReviews = allReviews.slice(start, end);

      pageReviews.forEach(r => {
        const div = document.createElement('div');
        div.className = 'review-item';
        const ratingHtml = '⭐'.repeat(r.rating || 5);
        const dateStr = r.ngay ? new Date(r.ngay).toLocaleDateString('vi-VN') : '';
        div.innerHTML = `
          <div class="review-meta">
            <strong>${escapeHtml(r.nguoiDung || 'Khách hàng')}</strong>
            <span>${/* safe */ dateStr}</span>
          </div>
          <div style="margin-bottom:8px;">${/* safe */ ratingHtml}</div>
          <p class="review-comment" style="color:var(--text-secondary);">${escapeHtml(r.comment || r.moTa || '')}</p>
        `;
        container.appendChild(div);
      });

      if (totalPages > 1) {
        for(let i=1; i<=totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn btn-sm ' + (i === currentReviewPage ? 'btn-primary' : 'btn-ghost');
            btn.textContent = i;
            btn.onclick = () => { currentReviewPage = i; renderReviews(); };
            pContainer.appendChild(btn);
        }
      }
    }

    async function loadCalendar() {
      const y = currentMonth.getUTCFullYear();
      const m = (currentMonth.getUTCMonth() + 1).toString().padStart(2, '0');
      document.getElementById('cal-month').textContent = m + '/' + y;
      const daysContainer = document.getElementById('cal-days');
      daysContainer.innerHTML = '<div style="grid-column: span 7; text-align:center;">Đang tải...</div>';
      
      try {
        const sitterId = currentSitter.sitterId || currentSitter.id;
        const availabilities = await apiFetch(`/sitters/${sitterId}/availability?month=${y}-${m}`);
        const availSet = new Set(availabilities || []);
        
        daysContainer.innerHTML = '';
        const firstDay = new Date(Date.UTC(y, currentMonth.getUTCMonth(), 1)).getUTCDay();
        const daysInMonth = new Date(Date.UTC(y, currentMonth.getUTCMonth() + 1, 0)).getUTCDate();
        
        for (let i = 0; i < firstDay; i++) {
          daysContainer.innerHTML += '<div></div>';
        }
        for (let i = 1; i <= daysInMonth; i++) {
          const dateStr = `${y}-${m}-${i.toString().padStart(2, '0')}`;
          const isAvail = availSet.has(dateStr);
          daysContainer.innerHTML += `<div class="cal-day ${/* safe */ isAvail ? 'available' : ''}">${/* safe */ i}</div>`;
        }
      } catch(e) {
        daysContainer.innerHTML = '<div style="grid-column: span 7; text-align:center; color:red;">Lỗi tải lịch</div>';
      }
    }

    function changeMonth(delta) {
      currentMonth.setUTCMonth(currentMonth.getUTCMonth() + delta);
      loadCalendar();
    }

    function bookSitter() {
      const sitterId = currentSitter.sitterId || currentSitter.id;
      localStorage.setItem('pawstay_selected_sitter', sitterId);
      if (!isLoggedIn()) {
        const returnUrl = encodeURIComponent(`booking.html?sitter=${sitterId}`);
        window.location.href = `login.html?returnUrl=${returnUrl}`;
      } else {
        window.location.href = `booking.html?sitter=${sitterId}`;
      }
    }
  </script>
</body>
</html>
