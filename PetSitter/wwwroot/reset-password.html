<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | PawStay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .auth-container { max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .auth-header p { color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Đặt lại mật khẩu</h1>
            <p>Vui lòng nhập mật khẩu mới</p>
        </div>
        <div id="error-msg" style="color: red; text-align: center; margin-bottom: 15px;"></div>
        <form id="reset-form" style="display:none;">
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="password" class="form-control" required minlength="8">
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 10px;">Đặt lại mật khẩu</button>
        </form>
        <div id="success-msg" style="display:none; text-align:center; padding: 20px;">
            <h3 style="color: green; margin-bottom: 10px;">Thành công!</h3>
            <p>Mật khẩu của bạn đã được thay đổi.</p>
            <a href="login.html" class="btn btn-primary" style="margin-top: 15px; display:inline-block;">Đăng nhập ngay</a>
        </div>
    </div>
    
    <script src="assets/api.js"></script>
    <script src="assets/components.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('error-msg').textContent = 'Liên kết không hợp lệ (thiếu token).';
        } else {
            document.getElementById('reset-form').style.display = 'block';
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            
            if (pass !== confirm) {
                document.getElementById('error-msg').textContent = 'Mật khẩu xác nhận không khớp.';
                return;
            }

            const btn = e.target.querySelector('button');
            document.getElementById('error-msg').textContent = '';
            
            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';

            try {
                // Not using apiFetch if we want to avoid auto-redirect on 401, but the prompt says:
                // "Lỗi này không được trả 401 (để apiFetch không đá về login)."
                // Since the server returns 400 for invalid token, apiFetch won't redirect to login.
                await apiFetch('/auth/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ token, newPassword: pass })
                });
                
                document.getElementById('reset-form').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
            } catch (err) {
                document.getElementById('error-msg').textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Đặt lại mật khẩu';
            }
        });
    </script>
</body>
</html>
