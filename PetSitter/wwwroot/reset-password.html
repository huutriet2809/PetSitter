<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | PawStay</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="assets/style.css?v=4">
    <link rel="stylesheet" href="css/reset-password.css?v=1">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Đặt lại mật khẩu</h1>
            <p>Vui lòng nhập mật khẩu mới</p>
        </div>
        <div id="error-msg" class="error-msg"></div>
        <form id="reset-form" class="hidden">
            <div class="form-group">
                <label for="password">Mật khẩu mới</label>
                <input type="password" id="password" class="form-control" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm-password">Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary submit-btn">Đặt lại mật khẩu</button>
        </form>
        <div id="success-msg" class="success-container hidden">
            <h3 class="success-title">Thành công!</h3>
            <p>Mật khẩu của bạn đã được thay đổi.</p>
            <a href="login.html" class="btn btn-primary login-btn">Đăng nhập ngay</a>
        </div>
    </div>
    
    <script src="assets/api.js?v=4"></script>
    <script src="assets/components.js?v=4"></script>
    <script src="js/reset-password.js?v=1" defer></script>
</body>
</html>
