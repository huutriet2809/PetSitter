<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thú cưng của tôi | PawStay Đà Nẵng</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .pets-wrapper { padding: 120px 24px 60px; max-width: 1000px; margin: 0 auto; min-height: 80vh; }
    .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .pets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .pet-card { background: var(--bg-card); padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); position: relative; }
    .pet-card h3 { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .pet-card p { margin-bottom: 4px; color: var(--text-secondary); font-size: 0.95rem; }
    .pet-actions { position: absolute; top: 24px; right: 24px; display: flex; gap: 8px; }
    .empty-state { text-align: center; padding: 60px 24px; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px dashed var(--border); }
  </style>
</head>
<body>
  <div class="pets-wrapper">
    <div class="header-flex">
      <h1>Thú cưng của tôi</h1>
      <button class="btn btn-primary" onclick="openPetModal()">+ Thêm thú cưng</button>
    </div>
    
    <div id="pets-container" class="pets-grid">
      <div style="text-align:center; padding:40px; grid-column: 1/-1;">Đang tải...</div>
    </div>
  </div>

  <div class="modal" id="pet-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="pet-modal-title">Thêm thú cưng</h3>
        <button class="modal-close" onclick="closePetModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="pet-form">
          <input type="hidden" id="pet-id" />
          <div style="margin-bottom:16px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Tên thú cưng *</label>
            <input type="text" id="pet-name" required style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);" />
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Loại *</label>
            <select id="pet-species" required style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);">
              <option value="Chó">Chó</option>
              <option value="Mèo">Mèo</option>
              <option value="Khác">Khác</option>
            </select>
          </div>
          <div style="margin-bottom:16px; display:flex; gap:16px;">
            <div style="flex:1;">
              <label style="display:block; margin-bottom:8px; font-weight:600;">Giống</label>
              <input type="text" id="pet-breed" style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);" />
            </div>
            <div style="flex:1;">
              <label style="display:block; margin-bottom:8px; font-weight:600;">Cân nặng (kg)</label>
              <input type="number" step="0.1" id="pet-weight" required style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);" />
            </div>
            <div style="flex:1;">
              <label style="display:block; margin-bottom:8px; font-weight:600;">Tuổi (năm)</label>
              <input type="number" id="pet-age" required style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);" />
            </div>
          </div>
          <div style="margin-bottom:16px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Ghi chú sức khỏe (Tối đa 500 ký tự)</label>
            <textarea id="pet-health" maxlength="500" style="width:100%; height:80px; padding:10px; border-radius:6px; border:1px solid var(--border);"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Lưu thông tin</button>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/components.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'login.html';
    }

    let myPets = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadPets();
    });

    async function loadPets() {
      try {
        myPets = await apiFetch('/pets');
        renderPets();
      } catch (err) {
        document.getElementById('pets-container').innerHTML = '<div style="color:red; text-align:center; grid-column:1/-1;">Lỗi tải thú cưng</div>';
      }
    }

    function renderPets() {
      const container = document.getElementById('pets-container');
      if (myPets.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <h2>Chưa có thú cưng nào</h2>
            <p style="color:var(--text-secondary); margin:12px 0 24px;">Hãy thêm thông tin thú cưng để đặt lịch nhanh chóng hơn.</p>
            <button class="btn btn-primary" onclick="openPetModal()">Thêm thú cưng ngay</button>
          </div>
        `;
        return;
      }

      container.innerHTML = myPets.map(p => `
        <div class="pet-card">
          <div class="pet-actions">
            <button class="btn btn-ghost btn-sm" onclick="editPet('${/* safe */ p.petId}')" title="Sửa">✏️</button>
            <button class="btn btn-ghost btn-sm" onclick="deletePet('${/* safe */ p.petId}')" title="Xóa" style="color:red;">🗑️</button>
          </div>
          <h3>${/* safe */ p.species === 'Chó' ? '🐶' : (p.species === 'Mèo' ? '🐱' : '🐾')} ${escapeHtml(p.name)}</h3>
          <p><strong>Loại:</strong> ${escapeHtml(p.species)}${/* safe */ p.breed ? ` (${escapeHtml(p.breed)})` : ''}</p>
          <p><strong>Cân nặng:</strong> ${/* safe */ p.weight || 0} kg | <strong>Tuổi:</strong> ${/* safe */ p.age || 0} năm</p>
          ${/* safe */ p.healthStatus ? `<p><strong>Sức khỏe:</strong> ${escapeHtml(p.healthStatus)}</p>` : ''}
        </div>
      `).join('');
    }

    function openPetModal(pet = null) {
      document.getElementById('pet-modal-title').textContent = pet ? 'Sửa thông tin' : 'Thêm thú cưng';
      document.getElementById('pet-id').value = pet ? pet.petId : '';
      document.getElementById('pet-name').value = pet ? pet.name : '';
      document.getElementById('pet-species').value = pet ? pet.species : 'Chó';
      document.getElementById('pet-breed').value = pet ? (pet.breed || '') : '';
      document.getElementById('pet-weight').value = pet ? pet.weight : '';
      document.getElementById('pet-age').value = pet ? pet.age : '';
      document.getElementById('pet-health').value = pet ? (pet.healthStatus || '') : '';
      document.getElementById('pet-modal').classList.add('open');
    }

    function closePetModal() {
      document.getElementById('pet-modal').classList.remove('open');
    }

    function editPet(id) {
      const pet = myPets.find(p => p.petId === id);
      if(pet) openPetModal(pet);
    }

    async function deletePet(id) {
      if(!confirm("Bạn có chắc chắn muốn xóa thú cưng này?")) return;
      try {
        await apiFetch(`/pets/${id}`, { method: 'DELETE' });
        showToast("Đã xóa thú cưng");
        loadPets();
      } catch (err) {
        showToast("Lỗi khi xóa: " + err.message);
      }
    }

    document.getElementById('pet-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('pet-id').value;
      const data = {
        name: document.getElementById('pet-name').value,
        species: document.getElementById('pet-species').value,
        breed: document.getElementById('pet-breed').value,
        weight: parseFloat(document.getElementById('pet-weight').value),
        age: parseInt(document.getElementById('pet-age').value),
        healthStatus: document.getElementById('pet-health').value
      };

      try {
        if (id) {
          await apiFetch(`/pets/${id}`, { method: 'PUT', body: JSON.stringify(data) });
        } else {
          await apiFetch('/pets', { method: 'POST', body: JSON.stringify(data) });
        }
        closePetModal();
        showToast("Lưu thông tin thành công");
        loadPets();
      } catch (err) {
        showToast(err.message || "Có lỗi xảy ra");
      }
    });
  </script>
</body>
</html>
