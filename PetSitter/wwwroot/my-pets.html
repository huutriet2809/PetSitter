<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thú cưng của tôi | PawStay Đà Nẵng</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
  <link rel="stylesheet" href="assets/style.css?v=4" />
  <link rel="stylesheet" href="css/my-pets.css?v=1" />
</head>
<body>
  <div class="pets-wrapper">
    <div class="header-flex">
      <h1>Thú cưng của tôi</h1>
      <button class="btn btn-primary" id="btn-open-pet-modal">+ Thêm thú cưng</button>
    </div>
    
    <div id="pets-container" class="pets-grid">
      <div class="loading-card">Đang tải...</div>
    </div>
  </div>

  <div class="modal" id="pet-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="pet-modal-title">Thêm thú cưng</h3>
        <button class="modal-close" id="btn-close-pet-modal">✕</button>
      </div>
      <div class="modal-body">
        <form id="pet-form">
          <input type="hidden" id="pet-id" />
          <div class="form-group">
            <label class="form-label" for="pet-name">Tên thú cưng *</label>
            <input type="text" id="pet-name" class="form-input" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="pet-species">Loại *</label>
            <select id="pet-species" class="form-select" required>
              <option value="Chó">Chó</option>
              <option value="Mèo">Mèo</option>
              <option value="Khác">Khác</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-col">
              <label class="form-label" for="pet-breed">Giống</label>
              <input type="text" id="pet-breed" class="form-input" />
            </div>
            <div class="form-col">
              <label class="form-label" for="pet-weight">Cân nặng (kg)</label>
              <input type="number" step="0.1" id="pet-weight" class="form-input" required />
            </div>
            <div class="form-col">
              <label class="form-label" for="pet-age">Tuổi (năm)</label>
              <input type="number" id="pet-age" class="form-input" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="pet-health">Ghi chú sức khỏe (Tối đa 500 ký tự)</label>
            <textarea id="pet-health" class="form-textarea" maxlength="500"></textarea>
          </div>
          <button type="submit" class="btn btn-primary submit-btn">Lưu thông tin</button>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/api.js?v=4"></script>
  <script src="assets/data.js?v=4"></script>
  <script src="assets/components.js?v=4"></script>
  <script src="js/my-pets.js?v=1" defer></script>
</body>
</html>
